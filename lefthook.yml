# Install/refresh with: bun run prepare
#
# pre-commit stays fast and staged-only; the whole-project checks (typecheck,
# knip, tests) live on pre-push so a green push is a green CI run.

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{js,ts,json,md}"
      run: bunx oxfmt --check {staged_files}
    lint:
      glob: "*.{js,ts}"
      # The same flag the `lint` script and CI carry: a directive that no longer
      # suppresses anything is an error there, so it has to be one here too.
      #
      # Check-only, and never `--fix`: a hook that fixes edits staged code after
      # the author read the diff and before anyone else does. It would also cost
      # every behaviour-changing autofixer plain `--fix` applies —
      # `unicorn/prefer-set-has` swaps the data structure, `preserve-caught-error`
      # injects `{ cause }` at sites the author did not touch — because leaving
      # them enabled would mean applying them silently on commit.
      run: bunx oxlint --report-unused-disable-directives-severity=error {staged_files}
    secrets:
      # --staged scans the index, not the working tree: a key that reaches a
      # commit is already burned, and a working-tree scan would fail over files
      # that were never going anywhere.
      run: gitleaks git --staged --redact --no-banner .

pre-push:
  parallel: true
  commands:
    typecheck:
      run: bun run typecheck
    test:
      run: bun test
