name: Queue

# This repo runs its own queue-integrity workflows, by relative path: the pin
# every other repo uses is a SHA, and a repo cannot pin to a commit it is in the
# middle of making.
on:
  issues:
    types: [labeled]
  schedule:
    # Monday morning, before the week's work is picked up.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    if: github.event_name == 'issues'
    uses: ./.github/workflows/queue-guard.yml

  audit:
    if: github.event_name != 'issues'
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/queue-audit.yml
