name: Queue guard

# Called from a repo's own workflow on `issues: labeled`:
#   jobs.guard.uses: gokayo43/dev-config/.github/workflows/queue-guard.yml@<sha>
#
# The caller grants `issues: write`, because the guard takes the label back
# rather than reporting it: the run is red *and* the invalid state is gone.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: gokayo43/dev-config/.github/actions/queue-guard@1d8b7f5cdb837c99bfe78f41fcc012ed729b4054 # v0.8.0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          label: ${{ github.event.label.name }}
          actor: ${{ github.event.sender.login }}
          owner: ${{ github.repository_owner }}
          issue: ${{ github.event.issue.number }}
