name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks reads history, and a shallow clone has none.
          fetch-depth: 0
          # Nothing here pushes, and the job runs third-party code (an
          # unpinned npx, a scaffolded tree's dependencies) in this workspace.
          persist-credentials: false

      - uses: ./.github/actions/secret-scan

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # This repo runs its own gates on itself, from the working tree. A gate
      # its author's repo cannot pass is a gate nobody should be asked to.
      #
      # Three facts here are structural rather than unfinished: the configs
      # inherit from this repo's own bases by relative path because a package
      # cannot extend itself by name, CI is this file rather than a call into
      # check.yml because a commit cannot pin its own SHA, and there is no
      # environment to shape — nothing here reads a secret at runtime.
      - uses: ./.github/actions/repo-contract
        with:
          exemptions: config-lineage ci-call secrets

      - uses: ./.github/actions/stack-gate

      # The hygiene suite writes directives as fixture text, so the scanner
      # finds them in the one file whose job is to contain them.
      - uses: ./.github/actions/suppression-hygiene
        with:
          fixtures: tests/suppression-hygiene.test.ts

      - run: bun install --frozen-lockfile

      # The gates this repo ships are TypeScript, and their suite is what proves
      # each one refuses a violating tree and passes a clean one. Every other
      # repo's gate is only as honest as these two lanes.
      - run: bun run check
      - run: bun test

      # The k6 ramp this repo ships is the one file its own linter cannot read,
      # so it gets executed instead: both branches, against a stub server.
      - name: Execute the capacity ramp
        env:
          # renovate: datasource=github-release-attachments depName=grafana/k6
          K6_VERSION: v2.1.0
          K6_SHA256: 295d961ebfca306f295f1133068dcd403a8171c87f387928f5f30b0fbcff858a
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . .github/actions/_lib/pinned-tool.sh
          pinned_tool \
            "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" \
            "$K6_SHA256" "k6-${K6_VERSION}-linux-amd64/k6"
          K6="$RUNNER_TEMP/k6" bun tests/capacity-script.ts

      - name: Parse every JSON config
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.json')
          # The ${} below are JS template literals, not shell expansions.
          # shellcheck disable=SC2016
          node -e '
            const { readFileSync } = require("node:fs");
            for (const file of process.argv.slice(1)) {
              try {
                JSON.parse(readFileSync(file, "utf8"));
              } catch (error) {
                console.log(`::error file=${file}::${error.message}`);
                process.exitCode = 1;
              }
            }
          ' "${files[@]}"

      # check.yml and the composite actions are the executable half of this
      # repo: a schema error in one of them breaks every consumer at once. The
      # action used here is this repo's own, at this commit — the repos that
      # scaffold from the template reach the same one by SHA.
      - uses: ./.github/actions/lint-workflows

      # actionlint only reads workflows — handed an action.yml it reports a
      # workflow with no `jobs`. So the composites are checked here for what
      # silently breaks them (a run step with no shell never runs the script it
      # carries) and their scripts go through the same shellcheck that
      # actionlint runs over a workflow's.
      - name: Check the composite actions
        run: |
          set -euo pipefail
          mapfile -t actions < <(git ls-files '.github/actions/*/action.y*ml')
          # The ${} below are JS template literals, not shell expansions.
          # shellcheck disable=SC2016
          bun -e '
            let index = 0;
            for (const file of Bun.argv.slice(1)) {
              const action = Bun.YAML.parse(await Bun.file(file).text());
              const problems = [];
              if (!action.name || !action.description) problems.push("needs a name and a description");
              if (action.runs?.using !== "composite") problems.push("runs.using must be composite");
              for (const step of action.runs?.steps ?? []) {
                if (!step.run) continue;
                if (!step.shell) problems.push(`step "${step.name ?? step.run.split("\n")[0]}" has run without shell`);
                await Bun.write(`${process.env.RUNNER_TEMP}/composite-${index++}.sh`, step.run);
              }
              for (const problem of problems) {
                console.log(`::error file=${file}::${problem}`);
                process.exitCode = 1;
              }
            }
          ' "${actions[@]}"
          shellcheck --shell=bash "$RUNNER_TEMP"/composite-*.sh
          # The one shell library the composites source, which the loop above
          # cannot see because it is not inlined in any run: block.
          shellcheck --shell=bash .github/actions/_lib/*.sh

      - name: Validate the Renovate preset
        # Deliberately unpinned: the preset has to hold against the Renovate that runs it today.
        run: npx --yes --package renovate renovate-config-validator --strict --no-global default.json

      - name: Check the Lighthouse budget
        run: |
          set -euo pipefail
          # The ${} below are JS template literals, not shell expansions.
          # shellcheck disable=SC2016
          node -e '
            const assert = require("node:assert/strict");
            const { readFileSync } = require("node:fs");
            const { ci } = JSON.parse(readFileSync("lighthouserc.json", "utf8"));
            assert.ok(ci.collect.staticDistDir, "collect.staticDistDir must name a built site");
            for (const category of ["performance", "accessibility", "best-practices", "seo"]) {
              assert.deepEqual(ci.assert.assertions[`categories:${category}`], ["error", { minScore: 1 }]);
            }
          '
