name: Check

# The gate every repo runs, held in one place and called by reference:
#   jobs.check.uses: gokayo43/dev-config/.github/workflows/check.yml@<sha>
#
# The executable steps live in .github/actions/* so that this workflow and the
# repos that scaffold from it run one copy. They are referenced by full path and
# SHA rather than `./`: inside a called workflow a relative `uses:` resolves
# against the CALLER's checkout, and checking this repo out into the caller's
# workspace would put its files under the caller's linter.
on:
  workflow_call:
    inputs:
      build:
        description: Build before the static gate — for repos whose types come from generated code that is not committed.
        type: boolean
        default: false
      database:
        description: >-
          Replay the migrations onto an empty Postgres, boot the app against the result,
          and ramp it — every route it serves, or an allowlisted reason why not.
        type: boolean
        default: false
      upgrade-gate:
        description: >-
          Also prove that upgrading a database built from the base ref's migrations reaches
          the schema a fresh one gets — for repos whose database is deployed somewhere.
        type: boolean
        default: false
      compose:
        description: Hold docker-compose.yml to the deployment shape — for repos this box runs as containers.
        type: boolean
        default: false
      contract-exemptions:
        description: >-
          Repo-contract facts this repo is structurally unable to satisfy, space-separated
          (config-lineage, ci-call, docs-spine, lifecycle-retire, secrets). A marketing site
          names docs-spine; a repo being wound down names lifecycle-retire.
        type: string
        default: ""
      start-command:
        description: How the boot gate starts the app.
        type: string
        default: bun run start
      health-url:
        description: What the boot gate polls until it answers 200.
        type: string
        default: http://localhost:3000/api/health
      capacity-script:
        description: A k6 script of the repo's own. Empty runs the ramp shipped with db-gate.
        type: string
        default: ""
      capacity-path:
        description: >-
          Paths to ramp alongside the health route, e.g. /api/things — comma- or
          newline-separated, since the route floor asks for every route the app serves.
        type: string
        default: ""
      capacity-report:
        description: >-
          The artifact name for the k6 summary, for a matrix that ramps more than one leg.
          Empty takes db-gate's own name, which is where that default lives.
        type: string
        default: ""
      route-allowlist:
        description: >-
          Routes the capacity ramp cannot cover, as `METHOD /path -- why` entries,
          comma- or newline-separated. The reason is part of the entry, and an entry
          without one is refused — the price a lint directive already pays.
        type: string
        default: ""
      timestamp-allowlist:
        description: schema.table.column entries whose value is a wall-clock reading rather than an instant, comma- or newline-separated.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Two steps here read history. gitleaks: the default shallow checkout
          # hands it one commit, so a secret committed and later deleted on the
          # same branch would go unreported even though pushing it had already
          # burned the key. repo-contract: `lifecycle` is compared with the base
          # ref's, and on a pull request the base branch has to be in the clone
          # — a ref this run names and the checkout lacks is refused outright.
          fetch-depth: 0
          # Nothing in this job pushes, and it installs and runs the repo's
          # dependencies in the same workspace the token would sit in.
          persist-credentials: false

      # Every one of these is aimed at a step of the database job, so asking for
      # one without that job is a request that would otherwise be ignored in
      # silence — and a gate nobody notices is off is the worst kind. A repo
      # that has written out the routes it wants ramped, or the reasons a route
      # cannot be, has said plainly that it expects a ramp.
      - if: >-
          ${{ !inputs.database && (inputs.upgrade-gate || inputs.capacity-path != ''
          || inputs.capacity-script != '' || inputs.capacity-report != ''
          || inputs.route-allowlist != '') }}
        env:
          UPGRADE_GATE: ${{ inputs.upgrade-gate }}
          CAPACITY_PATH: ${{ inputs.capacity-path }}
          CAPACITY_SCRIPT: ${{ inputs.capacity-script }}
          CAPACITY_REPORT: ${{ inputs.capacity-report }}
          ROUTE_ALLOWLIST: ${{ inputs.route-allowlist }}
        run: |
          set -euo pipefail
          if [ "$UPGRADE_GATE" = true ]; then
            echo "::error::upgrade-gate: true needs database: true — the upgrade path is replayed by the database job"
          fi
          if [ -n "$CAPACITY_PATH" ]; then
            echo "::error::capacity-path needs database: true — the ramp runs against the app the database job boots"
          fi
          if [ -n "$CAPACITY_SCRIPT" ]; then
            echo "::error::capacity-script needs database: true — the ramp runs against the app the database job boots"
          fi
          if [ -n "$CAPACITY_REPORT" ]; then
            echo "::error::capacity-report needs database: true — it names the artifact the database job's ramp uploads"
          fi
          if [ -n "$ROUTE_ALLOWLIST" ]; then
            echo "::error::route-allowlist needs database: true — the route floor is measured across the database job's ramp"
          fi
          exit 1

      - uses: gokayo43/dev-config/.github/actions/secret-scan@42cae85e2b346c0f843993710da31f8ee7aba6f8 # v0.39.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # The declarative gates read the tree as committed, so they run before the
      # install: a repo that has drifted out of the contract says so in seconds
      # rather than after a full dependency resolution.
      - uses: gokayo43/dev-config/.github/actions/repo-contract@42cae85e2b346c0f843993710da31f8ee7aba6f8 # v0.39.0
        with:
          database: ${{ inputs.database }}
          exemptions: ${{ inputs.contract-exemptions }}

      - uses: gokayo43/dev-config/.github/actions/stack-gate@42cae85e2b346c0f843993710da31f8ee7aba6f8 # v0.39.0

      # The caller's own workflows were schema-checked and pin-checked by
      # nothing until this ran here. Needs the Bun that setup-bun installed.
      - uses: gokayo43/dev-config/.github/actions/lint-workflows@42cae85e2b346c0f843993710da31f8ee7aba6f8 # v0.39.0

      - uses: gokayo43/dev-config/.github/actions/suppression-hygiene@42cae85e2b346c0f843993710da31f8ee7aba6f8 # v0.39.0

      - if: inputs.compose
        uses: gokayo43/dev-config/.github/actions/compose-lint@42cae85e2b346c0f843993710da31f8ee7aba6f8 # v0.39.0

      - run: bun install --frozen-lockfile

      - if: inputs.build
        run: bun run build

      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run knip

      - uses: gokayo43/dev-config/.github/actions/test-suite@42cae85e2b346c0f843993710da31f8ee7aba6f8 # v0.39.0

  database:
    if: inputs.database
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Empty on every run, which is the one state no developer database is ever
    # in. Images are pinned by digest for the same reason actions are, with the
    # tag kept inline: that is the form Renovate's docker datasource maintains.
    # Redis is started unconditionally — the API shape pings it from its health
    # route, and an idle container costs a couple of seconds.
    services:
      postgres:
        image: postgres:16-alpine@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine@sha256:8b81dd37ff027bec4e516d41acfbe9fe2460070dc6d4a4570a2ac5b9d59df065
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The upgrade gate replays the base ref's migrations, which are in the
          # history — and this job cannot fetch them later, because it holds no
          # credentials and every repo here is private. Unconditional rather
          # than keyed to the input: an expression that has to produce 0 rides
          # on how GitHub casts it, and the failure mode of getting that wrong
          # is a gate that reports nothing rather than one that says so. The
          # static job already pays for the same history in the same run.
          fetch-depth: 0
          # Nothing in this job pushes, and it installs and runs the repo's
          # dependencies in the same workspace the token would sit in.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - if: inputs.build
        run: bun run build

      - uses: gokayo43/dev-config/.github/actions/db-gate@42cae85e2b346c0f843993710da31f8ee7aba6f8 # v0.39.0
        with:
          upgrade-gate: ${{ inputs.upgrade-gate }}
          start-command: ${{ inputs.start-command }}
          health-url: ${{ inputs.health-url }}
          timestamp-allowlist: ${{ inputs.timestamp-allowlist }}
          capacity-script: ${{ inputs.capacity-script }}
          capacity-path: ${{ inputs.capacity-path }}
          capacity-report: ${{ inputs.capacity-report }}
          route-allowlist: ${{ inputs.route-allowlist }}
