name: Check

# The gate every repo runs, held in one place and called by reference:
#   jobs.check.uses: gokayo43/dev-config/.github/workflows/check.yml@<sha>
#
# The executable steps live in .github/actions/* so that this workflow and the
# repos that scaffold from it run one copy. They are referenced by full path and
# SHA rather than `./`: inside a called workflow a relative `uses:` resolves
# against the CALLER's checkout, and checking this repo out into the caller's
# workspace would put its files under the caller's linter.
on:
  workflow_call:
    inputs:
      build:
        description: Build before the static gate — for repos whose types come from generated code that is not committed.
        type: boolean
        default: false
      affected:
        description: >-
          Run the typecheck lane over the packages a pull request changed rather than the
          whole graph — turbo's `--affected`. The build never narrows: generated sources
          feed the whole-repo lint and knip lanes. For monorepos: needs turbo.json at
          the repository root, and is refused without one. Ignored on a push, where
          --affected selects nothing and main is the full run.
        type: boolean
        default: false
      database:
        description: >-
          Which database gates run. `postgres` replays the migrations onto an empty
          Postgres, boots the app against the result, and ramps it — every route it
          serves, or an allowlisted reason why not. `external` says a workflow wrapping
          this one runs the database gates in that job's place, which is what an
          extension of this workflow passes when it replaces them with its own dialect's
          — the repo still owes a db:migrate, and the eleven inputs aimed at the job
          here belong to the wrapper's own. `none` is a repo with no schema.
        type: string
        default: none
      upgrade-gate:
        description: >-
          Also prove that upgrading a database built from the base ref's migrations reaches
          the schema a fresh one gets — for repos whose database is deployed somewhere.
        type: boolean
        default: false
      semantic-fixtures:
        description: >-
          A directory of this repo's own holding the rows a deployed database already
          has, as base-compatible SQL, each with the assertion the current contract
          makes about them. Written into the base ref's replay and graded after this
          branch's migrations run over them. Needs `upgrade-gate: true`.
        type: string
        default: ""
      compose:
        description: Hold docker-compose.yml to the deployment shape — for repos this box runs as containers.
        type: boolean
        default: false
      mutation-lane:
        description: >-
          Mutate the domain files this branch changed and fail on a mutant its own lines
          left undetected — for repos whose pure domain is declared as a boundaries
          element. docs/gates/mutation-lane.md is where it is argued.
        type: boolean
        default: false
      mutation-floor:
        description: >-
          The mutation score the changed domain files must hold, as a fraction between 0
          and 1, the way bunfig.toml writes coverageThreshold. Empty publishes the score
          and enforces nothing. Set it with mutation-lane or not at all.
        type: string
        default: ""
      contract-exemptions:
        description: >-
          Repo-contract facts this repo is structurally unable to satisfy, space-separated
          (config-lineage, ci-call, docs-spine, lifecycle-retire, secrets). A marketing site
          names docs-spine; a repo being wound down names lifecycle-retire.
        type: string
        default: ""
      data-jobs-external:
        description: >-
          Where the deployment already runs a live repo's backup and restore drill, when
          they are not this repo's own scripts — the job, its schedule and the runbook.
          Empty, which is every repo that owns them, asks for scripts/backup.sh and
          scripts/restore-drill.sh with the units that run them. The reason is the waiver:
          a repo whose box already dumps this database can only satisfy the rule as written
          by committing a second dump on a second schedule, which is two answers to when
          the data is safe.
        type: string
        default: ""
      stack-allowlist:
        description: >-
          Packages this repo keeps against the stack denylist, as `<package> -- why`
          entries, one per line. The reason is part of the entry. An entry is refused
          when it has no reason, when nothing here declares the package any more, or
          when the denylist has stopped denying it.
        type: string
        default: ""
      backfill-seed:
        description: >-
          How to put a database into the state this repo's backfill was written for,
          as shell code. Set it with backfill-command or not at all.
        type: string
        default: ""
      backfill-command:
        description: >-
          The backfill, as shell code. Run twice against the state backfill-seed
          wrote, in a database of the check's own, with the data compared either side
          of the second run.
        type: string
        default: ""
      start-command:
        description: How the boot gate starts the app.
        type: string
        default: ""
      health-url:
        description: >-
          What the boot gate polls until it answers 200. Defaults to the port the
          job allocated, which is why the default is not stated here — see the
          db-gate step.
        type: string
        default: ""
      probe-command:
        description: >-
          A command of the repo's own, run against the booted app after it answers its
          health route and before the ramp, as shell code with the app's URL in
          HEALTH_URL. Its stdout is the verdict: every line it writes there is one
          problem, whatever it exits with.
        type: string
        default: ""
      probe-timeout:
        description: >-
          How many seconds probe-command gets before it is killed. Empty takes the
          bound db-gate declares, which is where the number and the argument for it
          live. Set it with `probe-command` or not at all.
        type: string
        default: ""
      capacity-script:
        description: A k6 script of the repo's own. Empty runs the ramp shipped with db-gate.
        type: string
        default: ""
      capacity-path:
        description: >-
          Paths to ramp alongside the health route, e.g. /api/things — one per line,
          since the route floor asks for every route the app serves.
        type: string
        default: ""
      db-gate-evidence:
        description: >-
          The artifact name for everything the database gate leaves behind. A matrix
          that runs more than one leg must give each its own or the run fails on the
          duplicate. Empty takes db-gate's own name, which is where that default lives.
        type: string
        default: ""
      test-network:
        description: >-
          Why this repo's suite has to reach a real network. Empty — which is every repo
          until one has an answer here — runs bun test sealed in a network namespace with
          nothing but loopback in it, so a live call fails where it is written rather than
          on the week somebody else's host is down.
        type: string
        default: ""
      test-suite-evidence:
        description: >-
          The artifact name for the junit report. A matrix that runs more than one leg
          must give each its own or the run fails on the duplicate. Empty takes
          test-suite's own name, which is where that default lives.
        type: string
        default: ""
      route-allowlist:
        description: >-
          Routes the capacity ramp cannot cover, as `METHOD /path -- why` entries,
          one per line. The reason is part of the entry, and an entry without one
          is refused — the price a lint directive already pays.
        type: string
        default: ""
      timestamp-allowlist:
        description: >-
          Columns whose value is a wall-clock reading rather than an instant, as
          `schema.table.column -- why` entries, one per line. The reason is part of the
          entry. An entry is refused when it has no reason, when the schema has no
          column of that name, or when that column is no longer a wall-clock one.
        type: string
        default: ""

permissions:
  contents: read

# Turborepo reports anonymous usage counts unless this is set, and a repo whose
# CI is a call to this workflow has nowhere else to say so: `env:` is not a
# permitted key on a job that uses a reusable workflow, and a caller's own
# workflow-level env does not reach the workflow it calls. Set here, so the
# scaffolded monorepo's .env — which covers a checkout and nothing else — has a
# counterpart for every CI run. Harmless where nothing reads it.
env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  static:
    # A caller with no runner carrying both labels queues here forever rather
    # than failing. That, and what a shared persistent machine changes about
    # service ports and the workspace: README, "Where it runs".
    runs-on: [self-hosted, linux]
    timeout-minutes: 15

    # `--affected` is turbo's, and it is a CLI flag with no environment form — so
    # a workflow that runs a repo's root scripts by name has nowhere to say it
    # unless the seam is here. Decided once, as an expression, because the two
    # facts it needs are the caller's input and the event: nothing on disk, so
    # nothing to run a step for.
    #
    # The event half is the whole of why it is not just the input. On a push to
    # main --affected diffs main against itself and selects zero packages, and a
    # change to a root file no package's inputs name selects zero as well — so
    # every lane would go green over nothing. The full run on main is what makes
    # handing the flag to a pull request safe at all.
    #
    # TURBO_SCM_BASE beside it because the flag alone does not narrow anything
    # here: actions/checkout leaves a detached HEAD carrying refs/remotes/origin/*
    # and no local branch, so turbo resolving its base by the ref NAME finds
    # none, reports "unable to detect git range, assuming all files have
    # changed", and runs the full graph — green, and silent about having ignored
    # the flag. The commit is the one thing that always resolves. Empty off a
    # pull request, where turbo's own default is what should decide.
    env:
      TURBO_AFFECTED: ${{ inputs.affected && github.event_name == 'pull_request' && '--affected' || '' }}
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Three steps here read history. gitleaks: the default shallow
          # checkout hands it one commit, so a secret committed and later
          # deleted on the same branch would go unreported even though pushing
          # it had already burned the key. repo-contract: `lifecycle` is
          # compared with the base ref's, and on a pull request the base branch
          # has to be in the clone — a ref this run names and the checkout lacks
          # is refused outright. The mutation lane: what it mutates is what this
          # branch changed against that same base ref, and it is refused the
          # same way.
          fetch-depth: 0
          # Nothing in this job pushes, and it installs and runs the repo's
          # dependencies in the same workspace the token would sit in.
          persist-credentials: false

      # Every input named below is aimed at a step of something the caller may
      # not have asked to run, so passing one is a request that would otherwise
      # be ignored in silence — and a gate nobody notices is off is the worst
      # kind. Eleven belong to the database job: a repo that has written out the
      # routes it wants ramped, or the reasons a route cannot be, has said
      # plainly that it expects a ramp. Two of the eleven are also aimed at each
      # other — `semantic-fixtures` needs the replay `upgrade-gate` adds, and
      # `probe-timeout` bounds a `probe-command` — so each is asked twice, once
      # about the job and once about the input it rides on. Then the mutation
      # lane's floor, which bounds a score only that step measures, and
      # `affected`, which needs a turbo to hand the flag to — the one condition
      # here that is a fact about the tree rather than about the inputs, which
      # is why the step runs after the checkout.
      #
      # The step has no `if:`. It had one, restating every condition its body
      # tests, and two statements of one rule is two places for it to be wrong:
      # a condition added below and forgotten above is a guard that silently
      # stops running, which is exactly the failure this whole step exists to
      # prevent. The body is the rule. The cost is one always-green step on
      # every run of every repo, which is a few seconds of a bash function that
      # never fires.
      - env:
          DATABASE: ${{ inputs.database }}
          UPGRADE_GATE: ${{ inputs.upgrade-gate }}
          CAPACITY_PATH: ${{ inputs.capacity-path }}
          CAPACITY_SCRIPT: ${{ inputs.capacity-script }}
          DB_GATE_EVIDENCE: ${{ inputs['db-gate-evidence'] }}
          ROUTE_ALLOWLIST: ${{ inputs.route-allowlist }}
          TIMESTAMP_ALLOWLIST: ${{ inputs.timestamp-allowlist }}
          BACKFILL_COMMAND: ${{ inputs.backfill-command }}
          BACKFILL_SEED: ${{ inputs.backfill-seed }}
          SEMANTIC_FIXTURES: ${{ inputs['semantic-fixtures'] }}
          PROBE_COMMAND: ${{ inputs['probe-command'] }}
          PROBE_TIMEOUT: ${{ inputs['probe-timeout'] }}
          MUTATION_LANE: ${{ inputs['mutation-lane'] }}
          MUTATION_FLOOR: ${{ inputs['mutation-floor'] }}
          AFFECTED: ${{ inputs.affected }}
        run: |
          set -euo pipefail
          wrong=0
          refuse() {
            echo "::error::$1"
            wrong=1
          }
          # A value nobody defined is refused rather than read as one of the
          # three: `none` is the value that switches every database rule off,
          # here and in the repo contract, so a typo falling through to it would
          # shed them in silence — which is the failure mode this whole step
          # exists to prevent.
          case $DATABASE in
            postgres | external | none) ;;
            *)
              refuse "database reads \"$DATABASE\" — it is postgres (this workflow's own database job), external (a workflow wrapping this one runs the database gates in that job's place) or none (the repo has no schema)"
              ;;
          esac
          # Re-asked here, because any one of the conditions above can be what
          # selected this step: without it a repo running the database job and no
          # mutation lane would be told its ramp inputs need a job it already
          # asked for.
          #
          # `external` refuses these exactly as `none` does, and for the reason
          # the guards exist: the job they configure does not run here either
          # way. The wrapper that took that job over declares its own, and an
          # input passed to this workflow instead would be read by nothing.
          if [ "$DATABASE" != postgres ]; then
            if [ "$UPGRADE_GATE" = true ]; then
              refuse "upgrade-gate: true needs database: postgres — the upgrade path is replayed by the database job"
            fi
            if [ -n "$CAPACITY_PATH" ]; then
              refuse "capacity-path needs database: postgres — the ramp runs against the app the database job boots"
            fi
            if [ -n "$CAPACITY_SCRIPT" ]; then
              refuse "capacity-script needs database: postgres — the ramp runs against the app the database job boots"
            fi
            if [ -n "$DB_GATE_EVIDENCE" ]; then
              refuse "db-gate-evidence needs database: postgres — it names the artifact the database job uploads"
            fi
            if [ -n "$ROUTE_ALLOWLIST" ]; then
              refuse "route-allowlist needs database: postgres — the route floor is measured across the database job's ramp"
            fi
            if [ -n "$TIMESTAMP_ALLOWLIST" ]; then
              refuse "timestamp-allowlist needs database: postgres — the column types are read from the database that job migrates"
            fi
            if [ -n "$BACKFILL_COMMAND" ]; then
              refuse "backfill-command needs database: postgres — the backfill runs against a database the database job builds"
            fi
            if [ -n "$BACKFILL_SEED" ]; then
              refuse "backfill-seed needs database: postgres — it writes into a database the database job builds"
            fi
            if [ -n "$SEMANTIC_FIXTURES" ]; then
              refuse "semantic-fixtures needs database: postgres — the fixtures are written into a replay the database job runs"
            fi
            if [ -n "$PROBE_COMMAND" ]; then
              refuse "probe-command needs database: postgres — the probe runs against the app the database job boots"
            fi
            if [ -n "$PROBE_TIMEOUT" ]; then
              refuse "probe-timeout needs database: postgres — it bounds a probe the database job runs"
            fi
          fi
          # The fixtures are written into a database built from the base ref's
          # migrations, which is the replay upgrade-gate adds. Without it there
          # is nowhere to write them, and a caller who asked would be told
          # nothing — the failure mode every guard here exists to prevent.
          if [ "$UPGRADE_GATE" != true ] && [ -n "$SEMANTIC_FIXTURES" ]; then
            refuse "semantic-fixtures needs upgrade-gate: true — the fixtures go into the replay of the base ref's migrations, which is the replay upgrade-gate adds"
          fi
          if [ -z "$PROBE_COMMAND" ] && [ -n "$PROBE_TIMEOUT" ]; then
            refuse "probe-timeout needs probe-command — it bounds that command, and on its own it bounds nothing"
          fi
          if [ "$MUTATION_LANE" != true ] && [ -n "$MUTATION_FLOOR" ]; then
            refuse "mutation-floor needs mutation-lane: true — the score it bounds is measured by that step"
          fi
          if [ "$AFFECTED" = true ] && [ ! -f turbo.json ]; then
            refuse "affected: true needs a turbo.json at the repository root — --affected is turbo's flag, and without turbo it is an argument this repo's build and typecheck scripts would be handed and refuse"
          fi
          exit "$wrong"

      - uses: gokayo43/dev-config/.github/actions/secret-scan@1aeb645afbeb782dc0c43d37bbf4e5d3203dcf8c # v0.53.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # The declarative gates read the tree as committed, so they run before the
      # install: a repo that has drifted out of the contract says so in seconds
      # rather than after a full dependency resolution.
      - uses: gokayo43/dev-config/.github/actions/repo-contract@1aeb645afbeb782dc0c43d37bbf4e5d3203dcf8c # v0.53.0
        with:
          database: ${{ inputs.database }}
          exemptions: ${{ inputs.contract-exemptions }}
          data-jobs-external: ${{ inputs['data-jobs-external'] }}

      - uses: gokayo43/dev-config/.github/actions/stack-gate@1aeb645afbeb782dc0c43d37bbf4e5d3203dcf8c # v0.53.0
        with:
          stack-allowlist: ${{ inputs.stack-allowlist }}

      # The caller's own workflows were schema-checked and pin-checked by
      # nothing until this ran here. Needs the Bun that setup-bun installed.
      - uses: gokayo43/dev-config/.github/actions/lint-workflows@1aeb645afbeb782dc0c43d37bbf4e5d3203dcf8c # v0.53.0

      - uses: gokayo43/dev-config/.github/actions/suppression-hygiene@1aeb645afbeb782dc0c43d37bbf4e5d3203dcf8c # v0.53.0

      # docs/gates/shell-scripts.md — nothing else here reads a repo's own shell.
      - uses: gokayo43/dev-config/.github/actions/shell-scripts@1aeb645afbeb782dc0c43d37bbf4e5d3203dcf8c # v0.53.0

      - if: inputs.compose
        uses: gokayo43/dev-config/.github/actions/compose-lint@1aeb645afbeb782dc0c43d37bbf4e5d3203dcf8c # v0.53.0

      - run: bun install --frozen-lockfile

      # Not narrowed, deliberately, even when the caller asked for it: a build
      # is what produces the generated sources the whole-repo lanes below then
      # read — a route tree, a codegen client — and a build over the changed
      # packages alone leaves lint, knip and the root typecheck reading files
      # nothing wrote this run.
      - if: inputs.build
        run: bun run build

      - run: bun run format:check
      - run: bun run lint
      # The one lane --affected narrows. Unquoted on purpose, and the
      # suppression is the price: empty, the expansion has to vanish rather than
      # arrive as an empty argument, which `turbo run typecheck ""` reads as a
      # task with no name and every other repo's script reads as a stray
      # argument. Quoting it and relying on `bun run` to drop the empty word is
      # what this used to do, and bun stopped doing it between 1.3.11 and 1.4.0
      # — on the `affected: false` path every repo takes. The value is this
      # workflow's own expression, a fixed literal or nothing, never anything a
      # caller writes, so there is no word here to split wrongly.
      - run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          bun run typecheck ${TURBO_AFFECTED:-}
      - run: bun run knip

      - uses: gokayo43/dev-config/.github/actions/test-suite@1aeb645afbeb782dc0c43d37bbf4e5d3203dcf8c # v0.53.0
        with:
          test-network: ${{ inputs['test-network'] }}
          test-suite-evidence: ${{ inputs['test-suite-evidence'] }}

      # After the suite, because a mutation score over a suite that does not pass
      # is a number about nothing — and it runs the repo's own install, which the
      # steps above have already put on disk.
      #
      # The bound is here rather than inside the action because a composite
      # action's own steps take no timeout-minutes; this is the only place a
      # caller can put one. Ten, against a campaign whose cost is a test run per
      # mutant: the fixture suite's runs are a couple of seconds for ten mutants
      # on a file, so ten minutes is thousands of mutants — far more than a pull
      # request's own domain lines produce, and short enough that a runner stuck
      # on one mutant does not eat the job's fifteen and take the evidence of
      # every step before it down with it.
      - if: inputs['mutation-lane']
        timeout-minutes: 10
        uses: gokayo43/dev-config/.github/actions/mutation-lane@1aeb645afbeb782dc0c43d37bbf4e5d3203dcf8c # v0.53.0
        with:
          mutation-floor: ${{ inputs['mutation-floor'] }}

  database:
    if: inputs.database == 'postgres'
    runs-on: [self-hosted, linux]
    timeout-minutes: 15

    # Empty on every run, which is the one state no developer database is ever
    # in. Images are pinned by digest for the same reason actions are, with the
    # tag kept inline: that is the form Renovate's docker datasource maintains.
    # Redis is started unconditionally — the API shape pings it from its health
    # route, and an idle container costs a couple of seconds.
    #
    # `127.0.0.1::` is the `ip::containerPort` form: loopback, and a host port
    # the daemon picks. Both halves are load-bearing on a self-hosted runner.
    # A bare `5432:5432` binds 0.0.0.0, and Docker's DNAT rule carries no
    # destination match, so the container answers on the box's public address
    # whatever the firewall says — ufw does not filter the FORWARD path Docker
    # installs. A fixed host port is also single-occupancy: two runners' jobs
    # overlapping is the ordinary case here, and the second to start dies with
    # "port is already allocated". The assigned port is read back below.
    services:
      postgres:
        image: postgres:16-alpine@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 127.0.0.1::5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 127.0.0.1::6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres
      REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The upgrade gate replays the base ref's migrations, which are in the
          # history — and this job cannot fetch them later, because it holds no
          # credentials and every repo here is private. Unconditional rather
          # than keyed to the input: an expression that has to produce 0 rides
          # on how GitHub casts it, and the failure mode of getting that wrong
          # is a gate that reports nothing rather than one that says so. The
          # static job already pays for the same history in the same run.
          fetch-depth: 0
          # Nothing in this job pushes, and it installs and runs the repo's
          # dependencies in the same workspace the token would sit in.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - if: inputs.build
        run: bun run build

      # The port the boot gate's app listens on, picked by the kernel rather
      # than stated. 3000 is the framework default and therefore the one port
      # every other service on a shared box has already taken; it is also what
      # two of these jobs would collide on. Binding port 0 and reading the
      # assignment back is the only way to name a port nothing else holds —
      # asking whether a fixed one is free and then using it is a race.
      #
      # PORT is the platform convention, so an app that honours it needs no
      # further wiring; one that does not sets start-command and health-url.
      - name: Allocate a port for the app
        run: |
          bun -e 'const s = Bun.listen({ hostname: "127.0.0.1", port: 0, socket: { data() {} } });
                  console.log(`PORT=${s.port}`); s.stop(true);' >> "$GITHUB_ENV"

      - uses: gokayo43/dev-config/.github/actions/db-gate@1aeb645afbeb782dc0c43d37bbf4e5d3203dcf8c # v0.53.0
        with:
          upgrade-gate: ${{ inputs.upgrade-gate }}
          semantic-fixtures: ${{ inputs['semantic-fixtures'] }}
          backfill-seed: ${{ inputs.backfill-seed }}
          backfill-command: ${{ inputs.backfill-command }}
          start-command: ${{ inputs.start-command || 'bun run start' }}
          health-url: ${{ inputs.health-url || format('http://localhost:{0}/api/health', env.PORT) }}
          probe-command: ${{ inputs['probe-command'] }}
          probe-timeout: ${{ inputs['probe-timeout'] }}
          timestamp-allowlist: ${{ inputs.timestamp-allowlist }}
          capacity-script: ${{ inputs.capacity-script }}
          capacity-path: ${{ inputs.capacity-path }}
          db-gate-evidence: ${{ inputs['db-gate-evidence'] }}
          route-allowlist: ${{ inputs.route-allowlist }}
