name: Check

# The gate every repo runs, held in one place and called by reference:
#   jobs.check.uses: gokayo43/dev-config/.github/workflows/check.yml@<sha>
#
# The executable steps live in .github/actions/* so that this workflow and the
# repos that scaffold from it run one copy. They are referenced by full path and
# SHA rather than `./`: inside a called workflow a relative `uses:` resolves
# against the CALLER's checkout, and checking this repo out into the caller's
# workspace would put its files under the caller's linter.
on:
  workflow_call:
    inputs:
      build:
        description: Build before the static gate — for repos whose types come from generated code that is not committed.
        type: boolean
        default: false
      database:
        description: Replay the migrations onto an empty Postgres and boot the app against the result.
        type: boolean
        default: false
      compose:
        description: Hold docker-compose.yml to the deployment shape — for repos this box runs as containers.
        type: boolean
        default: false
      contract-exemptions:
        description: >-
          Repo-contract facts this repo is structurally unable to satisfy, space-separated
          (config-lineage, ci-call, docs-spine, secrets). A marketing site names docs-spine.
        type: string
        default: ""
      start-command:
        description: How the boot gate starts the app.
        type: string
        default: bun run start
      health-url:
        description: What the boot gate polls until it answers 200.
        type: string
        default: http://localhost:3000/api/health
      capacity:
        description: Ramp the booted app with k6 and publish the measurement. Requires the database job.
        type: boolean
        default: false
      capacity-script:
        description: A k6 script of the repo's own. Empty runs the ramp shipped with db-gate.
        type: string
        default: ""
      capacity-path:
        description: >-
          Paths to ramp alongside the health route, e.g. /api/things — comma- or
          newline-separated, since the route floor asks for every route the app serves.
        type: string
        default: ""
      capacity-report:
        description: The artifact name for the k6 summary, for a matrix that ramps more than one leg.
        type: string
        default: capacity-report
      route-allowlist:
        description: >-
          Routes the capacity ramp cannot cover, as `METHOD /path -- why` entries,
          comma- or newline-separated. The reason is part of the entry, and an entry
          without one is refused — the price a lint directive already pays.
        type: string
        default: ""
      timestamp-allowlist:
        description: schema.table.column entries whose value is a wall-clock reading rather than an instant, comma- or newline-separated.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks reads history; the default shallow checkout hands it one
          # commit, so a secret committed and later deleted on the same branch
          # would go unreported even though pushing it had already burned the key.
          fetch-depth: 0
          # Nothing in this job pushes, and it installs and runs the repo's
          # dependencies in the same workspace the token would sit in.
          persist-credentials: false

      # The ramp runs against the app the database job boots, so asking for one
      # without the other is a request that would otherwise be ignored in
      # silence — and a capacity gate nobody notices is off is the worst kind.
      - if: ${{ inputs.capacity && !inputs.database }}
        run: |
          echo "::error::capacity: true needs database: true — the ramp runs against the app the database job boots"
          exit 1

      - uses: gokayo43/dev-config/.github/actions/secret-scan@1d4d630f922401a8a2cb0ef634c348092eac39f5 # v0.18.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # The declarative gates read the tree as committed, so they run before the
      # install: a repo that has drifted out of the contract says so in seconds
      # rather than after a full dependency resolution.
      - uses: gokayo43/dev-config/.github/actions/repo-contract@1d4d630f922401a8a2cb0ef634c348092eac39f5 # v0.18.0
        with:
          database: ${{ inputs.database }}
          exemptions: ${{ inputs.contract-exemptions }}

      - uses: gokayo43/dev-config/.github/actions/stack-gate@1d4d630f922401a8a2cb0ef634c348092eac39f5 # v0.18.0

      # The caller's own workflows were schema-checked and pin-checked by
      # nothing until this ran here. Needs the Bun that setup-bun installed.
      - uses: gokayo43/dev-config/.github/actions/lint-workflows@1d4d630f922401a8a2cb0ef634c348092eac39f5 # v0.18.0

      - uses: gokayo43/dev-config/.github/actions/suppression-hygiene@1d4d630f922401a8a2cb0ef634c348092eac39f5 # v0.18.0

      - if: inputs.compose
        uses: gokayo43/dev-config/.github/actions/compose-lint@1d4d630f922401a8a2cb0ef634c348092eac39f5 # v0.18.0

      - run: bun install --frozen-lockfile

      - if: inputs.build
        run: bun run build

      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run knip

      - uses: gokayo43/dev-config/.github/actions/test-suite@1d4d630f922401a8a2cb0ef634c348092eac39f5 # v0.18.0

  database:
    if: inputs.database
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Empty on every run, which is the one state no developer database is ever
    # in. Images are pinned by digest for the same reason actions are, with the
    # tag kept inline: that is the form Renovate's docker datasource maintains.
    # Redis is started unconditionally — the API shape pings it from its health
    # route, and an idle container costs a couple of seconds.
    services:
      postgres:
        image: postgres:16-alpine@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine@sha256:8b81dd37ff027bec4e516d41acfbe9fe2460070dc6d4a4570a2ac5b9d59df065
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - if: inputs.build
        run: bun run build

      - uses: gokayo43/dev-config/.github/actions/db-gate@1d4d630f922401a8a2cb0ef634c348092eac39f5 # v0.18.0
        with:
          start-command: ${{ inputs.start-command }}
          health-url: ${{ inputs.health-url }}
          timestamp-allowlist: ${{ inputs.timestamp-allowlist }}
          capacity: ${{ inputs.capacity }}
          capacity-script: ${{ inputs.capacity-script }}
          capacity-path: ${{ inputs.capacity-path }}
          capacity-report: ${{ inputs.capacity-report }}
          route-allowlist: ${{ inputs.route-allowlist }}
