name: Queue audit

# Called from a repo's own workflow on a schedule:
#   jobs.audit.uses: gokayo43/dev-config/.github/workflows/queue-audit.yml@<sha>
#
# A tripwire, not an enforcer. Which label an issue carries is a convention out
# of the canon; this reads the queue once a week for the two things that rot
# without anyone noticing — a vocabulary that has drifted, and a commitment
# whose trigger nobody wrote down. Neither fails anything on its own, which is
# why they need a run of their own.
on:
  workflow_call:
    inputs:
      vocabulary:
        description: Every label the repo may carry, space-separated. Empty means the canon set.
        type: string
        default: ""
      commitment-label:
        description: The label whose issues must state a Trigger in the body. Empty means the canon one.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: gokayo43/dev-config/.github/actions/queue-audit@1295f94bc021409361144d9ff18559787753e1d0 # v0.10.0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          vocabulary: ${{ inputs.vocabulary }}
          commitment-label: ${{ inputs.commitment-label }}
