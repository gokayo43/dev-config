name: Lint workflows
description: >-
  Runs actionlint over the calling repository's workflows, with shellcheck over
  every run: block, and holds every `uses:` to a commit SHA. actionlint finds
  `.github/workflows` itself; extra-paths is for workflow files kept elsewhere.

inputs:
  extra-paths:
    description: Additional workflow files to lint, space-separated.
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        # renovate: datasource=github-release-attachments depName=rhysd/actionlint
        ACTIONLINT_VERSION: v1.7.12
        ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        EXTRA_PATHS: ${{ inputs.extra-paths }}
      run: |
        set -euo pipefail
        curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
          "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz"
        echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
        "$RUNNER_TEMP/actionlint" -color
        if [ -n "$EXTRA_PATHS" ]; then
          # Splitting is the point: EXTRA_PATHS is a list of files.
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/actionlint" -color $EXTRA_PATHS
        fi

    # actionlint is silent on a floating tag, and a tag is a name its owner can
    # repoint at any commit — including after the version was reviewed here.
    # Composite actions are read too: they carry `uses:` of their own.
    - name: Pin every action by commit SHA
      shell: bash
      env:
        EXTRA_PATHS: ${{ inputs.extra-paths }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        files=(.github/workflows/*.yml .github/workflows/*.yaml .github/actions/*/action.yml)
        shopt -u nullglob
        if [ -n "$EXTRA_PATHS" ]; then
          # Splitting is the point: EXTRA_PATHS is a list of files.
          # shellcheck disable=SC2206
          files+=($EXTRA_PATHS)
        fi
        status=0
        for file in "${files[@]}"; do
          while IFS= read -r hit; do
            line=${hit%%:*}
            value=${hit#*uses:}
            value=${value%%#*}
            value=$(printf '%s' "$value" | tr -d '[:space:]')
            # A local action carries no ref, and a docker:// image is pinned by
            # its own digest syntax rather than a git commit.
            case "$value" in
              ./* | docker://*) continue ;;
            esac
            ref=${value##*@}
            if [ "$ref" = "$value" ] || ! printf '%s' "$ref" | grep -qE '^[0-9a-f]{40}$'; then
              echo "::error file=$file,line=$line::pin by commit SHA with the tag as trailing comment: $value"
              status=1
            fi
          done < <(grep -nE '^[[:space:]]*(- )?uses:' "$file" || true)
        done
        exit "$status"
