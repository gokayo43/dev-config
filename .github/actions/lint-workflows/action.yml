name: Lint workflows
description: >-
  Runs actionlint over the calling repository's workflows, with shellcheck over
  every run: block, and holds every `uses:` to a commit SHA. actionlint finds
  `.github/workflows` itself; extra-paths is for workflow files kept elsewhere.
  The pin check parses the YAML, so the caller sets Bun up first.

inputs:
  working-directory:
    description: Where the repository root is.
    default: .
  extra-paths:
    description: >-
      Additional workflow files to lint, space-separated. Globs are allowed; one
      that matches nothing is an error, since that is how a renamed file stops
      being checked.
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        # renovate: datasource=github-release-attachments depName=rhysd/actionlint
        ACTIONLINT_VERSION: v1.7.12
        ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        EXTRA_PATHS: ${{ inputs.extra-paths }}
      run: |
        set -euo pipefail
        # shellcheck source=/dev/null
        . "$GITHUB_ACTION_PATH/../_lib/pinned-tool.sh"
        pinned_tool \
          "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz" \
          "$ACTIONLINT_SHA256" actionlint
        "$RUNNER_TEMP/actionlint" -color
        if [ -n "$EXTRA_PATHS" ]; then
          # Splitting is the point: EXTRA_PATHS is a list of files.
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/actionlint" -color $EXTRA_PATHS
        fi

    # actionlint is silent on a floating tag, and a tag is a name its owner can
    # repoint at any commit — including after the version was reviewed here.
    - name: Pin every action by commit SHA
      shell: bash
      env:
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_EXTRA_PATHS: ${{ inputs.extra-paths }}
      run: |
        set -euo pipefail
        bun "$GITHUB_ACTION_PATH/pins.main.ts"
