name: Repo contract
description: >-
  Asserts the facts a repo has to declare about itself: the package manager and
  its pins, the config lineage back to this repo, the install and coverage
  policy, the hooks, the shape of its secrets, the docs spine, a CI call pinned
  by commit SHA, and whether it is carrying real people. Every one of them is a
  string a repo can drift out of silently, and each one that drifts turns
  another gate into a no-op.

  That last one is `lifecycle`, which reads "dev" or "live". "live" derives what
  a repo with users owes — crash reporting, and for one that owns migrations a
  backup script, a rehearsed restore and the upgrade gate — from the repo
  itself rather than from this action's inputs, so none of it can be shed by
  editing the workflow those rules are about. It is also read at the base ref,
  because a field that only ever moves up cannot be tidied back down by a
  commit nobody reads twice; `lifecycle-retire` is the deliberate way down.
  docs/gates/repo-contract.md has the table.

inputs:
  working-directory:
    description: Where the repository root is.
    default: .
  database:
    description: >-
      Which database gates the caller runs — postgres, external or none. Anything
      but none replays this repo's schema, so the repo has to expose a db:migrate
      script; external is a wrapper workflow running the gates in check.yml's
      Postgres job's place, and is what an extension of that workflow passes.
    default: none
  exemptions:
    description: >-
      Facts this repo is structurally unable to satisfy, space-separated:
      config-lineage, ci-call, docs-spine, lifecycle-retire, secrets. Anything
      else fails, so a typo cannot quietly waive a check.
    default: ""
  data-jobs-external:
    description: >-
      Where the deployment already runs this repo's backup and restore drill,
      when they are not this repo's own scripts — the job, its schedule and the
      runbook. Empty, which is every repo that owns them, asks for
      scripts/backup.sh and scripts/restore-drill.sh with the units that run
      them. The reason IS the waiver: there is no way to claim it without naming
      the jobs, and it is read in review like the reason on a lint directive.
    default: ""

runs:
  using: composite
  steps:
    # The two facts about the run are read from the `github` context here rather
    # than threaded through as inputs, for the reason db-gate reads them the
    # same way: they are the event's own, identical for every caller, and a
    # caller that had to pass them could pass them wrong. A live repo needs the
    # base ref in the checkout — fetch-depth: 0 — and is refused without it.
    - shell: bash
      env:
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_DATABASE: ${{ inputs.database }}
        INPUT_EXEMPTIONS: ${{ inputs.exemptions }}
        INPUT_DATA_JOBS_EXTERNAL: ${{ inputs['data-jobs-external'] }}
        INPUT_BASE_REF: ${{ github.base_ref }}
        INPUT_BEFORE: ${{ github.event.before }}
      run: |
        set -euo pipefail
        bun "$GITHUB_ACTION_PATH/repo-contract.main.ts"
