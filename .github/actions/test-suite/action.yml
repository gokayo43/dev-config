name: Test suite
description: >-
  Runs the repo's suite with no route off the host and proves the run happened.
  A suite that skips when its database is missing leaves CI green over nothing at
  all, and bun records both shapes that takes: a skipped test as <skipped/>, one
  that returned early instead as assertions="0".

  The suite is the `test` script the repo's package.json declares, run through
  `bun run` with the coverage and reporter flags appended, and bare `bun test`
  where no script is declared. A repo whose tests need a bootstrap puts it in
  that script, and the gate has to run what the repo runs. Where that command
  is `bun test` itself and names no limit, every run but the nightly gives each
  test and hook a minute rather than bun's five seconds.

  The lane this runs is the one the shared check.yml gives it: a job with no
  service containers, which is what makes it a unit lane rather than a naming
  convention. A test that reaches a live host there is slow, is graded by
  somebody else's uptime, and fails on the week the gate is loudest — so the run
  is sealed in a network namespace and the call fails where it is written.
  docs/gates/test-suite.md has the shape of it.

inputs:
  working-directory:
    description: Where the suite lives.
    default: .
  test-network:
    description: >-
      Why this repo's suite has to reach a real network, which unseals it.
      Empty — which is every repo until one has an answer here — runs the suite
      with nothing but loopback reachable. The reason is the input: it is read
      in review like the reason on a lint directive, and it is about the suite,
      never about the gate.
    default: ""
  nightly:
    description: >-
      Give the suite's property tests the long budget. The two numbers, and the
      per-test bound that has to clear them, are in the step below: a budget a
      caller could name is a budget a caller could turn down, and what this
      buys is that the search a nightly makes is not the one a developer waits
      for.
    default: "false"
  test-suite-evidence:
    description: >-
      The artifact name for the junit report. A matrix that runs more than one
      leg MUST give each its own: an artifact name may be claimed once per run,
      the default below is a constant, and the second leg to upload fails on the
      duplicate. Empty takes that default, so a caller can pass this straight
      through without having to know how "unset" is spelled.
    default: ""

runs:
  using: composite
  steps:
    - name: Run the suite
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TEST_NETWORK: ${{ inputs['test-network'] }}
        NIGHTLY: ${{ inputs.nightly }}
      run: |
        set -euo pipefail
        report=$RUNNER_TEMP/junit.xml

        # The repo's own suite command, when it declares one. A suite that needs
        # a bootstrap around it — containers to start, an env file to refuse,
        # fixtures to build — puts that in the `test` script, and a gate running
        # bare `bun test` there runs the command that repo designed to fail.
        # Absent (no manifest, or no script in it), bare `bun test` is the suite,
        # which is every repo whose script is `bun test` anyway.
        #
        # The flags below are appended rather than substituted: `bun run` passes
        # trailing arguments to the script, so they reach the `bun test` the
        # script ends in. A script that swallows them writes no report, and the
        # check further down is what says so — which is why that check is by
        # name rather than left to the greps after it.
        #
        # The absent manifest is asked about rather than thrown over. `require`
        # here read "no package.json" as an exception on bun 1.4.0 and printed
        # the word `undefined` on 1.3.11 (probed on both), and a non-empty
        # `declared` sends the run to `bun run test` — which, with no script of
        # that name, is `/usr/bin/test` and dies on the first flag. Both bun
        # versions are in this fleet, so the question has to be one they answer
        # the same way.
        declared=$(bun -e 'const f = Bun.file("package.json"); const s = (await f.exists()) ? ((await f.json()).scripts?.test ?? "") : ""; console.write(String(s));' 2>/dev/null || true)
        # --coverage here rather than `[test] coverage` in the graded repo's
        # bunfig, which is what makes the floor a CI gate instead of a tax on
        # every run its author makes: docs/gates/test-suite.md.
        flags=(--coverage --reporter=junit --reporter-outfile="$report")

        # The property budget, for the run nobody is waiting on. Fifty times the
        # runs each property asked for, and two minutes as the most any one of
        # them may spend reaching that — the factor alone turns one slow
        # property into a job that never ends, and the pair says "as many runs
        # as fit in two minutes" instead. Both are read by `property.ts` at the
        # root of this package, which is where what they mean is written; this
        # is the one place they are spelled out rather than imported, because
        # this end is bash.
        #
        # Ten minutes per test with them, against bun's five seconds: a bound
        # below the budget turns every long property into a timeout, and the
        # gap between the two is what a test holding several properties needs.
        # It is a per-test bound and the job's own timeout is what bounds the
        # suite.
        #
        # Every other run gives a suite whose command is `bun test` itself, and
        # names no limit, one minute per test and hook against bun's five
        # seconds. A test's wall time is its CPU time over its share of a core:
        # a case needing about 0.1s of CPU took 3.9s at a 3% quota and timed
        # out at five seconds in a full run at load 40 on 16 cores (dev-config,
        # 2026-11-19). A minute is the ceiling wmstcs's wrapper and nfp-elysia's
        # script each chose under that load: a test needing up to 1.8s of CPU
        # passes at a 3% share, and a hung one costs a minute of the job's
        # fifteen. bun keeps the last --timeout it is given, so this one would
        # outrank a limit the script states and is left off it; any other
        # script is a suite command its repo designed, limit included, and gets
        # nothing. docs/gates/test-suite.md has the rest.
        #
        # A spelling this does not know is refused rather than read as "not
        # nightly": the nightly is the run nobody watches, and a typo there is a
        # long budget that silently never happened.
        case $NIGHTLY in
          true)
            export PROPERTY_RUNS_FACTOR=50 PROPERTY_TIME_LIMIT_MS=120000
            flags+=(--timeout 600000)
            ;;
          false)
            case $declared in
              *--timeout*) ;;
              "" | "bun test" | "bun test "*) flags+=(--timeout 60000) ;;
            esac
            ;;
          *)
            echo "::error::nightly is \"$NIGHTLY\" — it takes true or false, and nothing else can be read as either"
            exit 1
            ;;
        esac

        if [ -n "$declared" ]; then
          suite=(bun run test "${flags[@]}")
        else
          suite=(bun test "${flags[@]}")
        fi
        seal=()

        # Trimmed, the way every allowlist entry in this repo is trimmed before
        # it is read for a reason: a value made of spaces is not one, and this
        # input exists only to carry a reason.
        reason=${TEST_NETWORK#"${TEST_NETWORK%%[![:space:]]*}"}
        reason=${reason%"${reason##*[![:space:]]}"}

        if [ -n "$reason" ]; then
          # A workflow command ends at the end of a line, so a reason written
          # across several would put everything after the first outside the
          # notice — and into the log as whatever those lines happen to spell.
          # Refused rather than silently truncated: half a reason in the log is
          # worse than none, because it reads like the whole one.
          #
          # Both terminators, because the runner honours both: it reads a
          # child's stdout with StreamReader.ReadLine (actions/runner,
          # ProcessInvoker.cs), which ends a line on a carriage return, a line
          # feed, or the pair. A test for `\n` alone lets `reason\r::add-mask::x`
          # through as one shell string and two runner lines.
          case $reason in
            *[$'\n'$'\r']*)
              echo "::error::test-network must be one line — it is read in review, and a workflow command ends at the first carriage return or line feed, so the rest of the reason would be swallowed"
              exit 1
              ;;
          esac
          echo "::notice::the suite reaches a real network: $reason"
        else
          # The seal, taken as the user this step runs as. bubblewrap makes a
          # user namespace and in it a network namespace with loopback up, so
          # the suite keeps this step's uid, directory and environment, and no
          # root is needed. The process namespace is what ends the suite with
          # the step: bwrap passes no signal on, and once the namespace's first
          # process exits the kernel kills the rest. `--die-with-parent` makes
          # that happen when bwrap or this shell dies. `--proc` comes after the
          # bind of `/`, which would otherwise cover it with the host's `/proc`,
          # where the pids the suite holds name other processes.
          seal=(bwrap --unshare-net --unshare-pid --dev-bind / / --proc /proc --die-with-parent --)
          if ! command -v bwrap >/dev/null; then
            echo "::error::the suite is run sealed in a network namespace, which needs bubblewrap on the runner, and there is no bwrap on PATH — install bubblewrap, or a suite that genuinely reaches a network says so in the test-network input instead"
            exit 1
          fi
          # The seal itself, over a server that binds loopback and calls itself,
          # so a runner that cannot take it is told before the suite starts.
          if ! refused=$("${seal[@]}" bun -e 'const server = Bun.serve({ hostname: "127.0.0.1", port: 0, fetch: () => new Response("sealed") }); const said = await (await fetch(server.url)).text(); await server.stop(true); if (said !== "sealed") process.exit(1);' 2>&1); then
            printf '%s\n' "$refused"
            echo "::error::the suite is run sealed in a network namespace, and bubblewrap could not take one on this runner (its output is above) — bwrap has to be allowed to create a user namespace, and where AppArmor restricts unprivileged ones (kernel.apparmor_restrict_unprivileged_userns=1) that takes an AppArmor profile letting bwrap do so; a suite that genuinely reaches a network says so in the test-network input instead"
            exit 1
          fi
        fi

        # As a job this shell owns, rather than in the foreground. The runner
        # cancels a step by signalling the process it started and nothing else
        # (actions/runner's ProcessInvoker: SIGINT, 7.5s, SIGTERM, 2.5s,
        # SIGKILL, to the entry process alone), so a foreground suite would run
        # on until the SIGTERM ended this shell. Forwarded, the first signal
        # ends bwrap and with it the suite's namespace. Unsealed it reaches the
        # suite's first process alone: under `bun run test` that is `bun run`,
        # and the processes the suite started outlive the step.
        "${seal[@]}" "${suite[@]}" &
        running=$!
        trap 'kill -TERM "$running" 2>/dev/null || true' INT TERM
        wait "$running"

        # The report is what the two checks below are, so its absence is its own
        # diagnostic: a green run that wrote none is a `test` script that kept
        # the reporter flags to itself, and every grep after this would report
        # the missing file as the fault it was looking for.
        [ -f "$report" ] \
          || { echo "::error::the suite passed and wrote no junit report — this step appends --coverage and the two --reporter flags to the package.json test script, so that script has to end in a bun test its trailing arguments reach; a wrapper building an argv of its own has to pass them through (docs/gates/test-suite.md)"; exit 1; }

        # Anchored on the root element: a per-file <testsuite name="…"> line
        # carries its own skipped count, and a file whose name contains
        # "testsuites" would otherwise answer for the whole run.
        grep -q '<testsuites [^>]* skipped="0"' "$report" \
          || { echo "::error::skipped tests: a suite whose infrastructure is absent must fail, never skip"; exit 1; }
        ! grep -o '<testcase name="[^"]*"[^>]*assertions="0"' "$report" \
          || { echo "::error::the tests listed above asserted nothing — assert with expect, properties included; an assertion-free pass is indistinguishable from a test that never ran"; exit 1; }

    # The report the two checks above read, which is written into the runner and
    # deleted with it. A failing suite is exactly when the per-test detail is
    # worth having — which case skipped, what the timings were, the failure
    # message bun truncated in the log — so it leaves the run whatever happened
    # to it, and a cancelled run has nothing to say.
    - name: Publish the junit report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs['test-suite-evidence'] || 'test-suite-evidence' }}
        path: ${{ runner.temp }}/junit.xml
        # bun writes it before either check reads it, but a run that died on the
        # command itself never got that far.
        if-no-files-found: ignore
