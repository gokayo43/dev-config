name: Mutation lane
description: >-
  Mutates the domain files this branch changed and fails on a mutant its own
  lines left undetected, on a run whose suite was already failing before anything
  was mutated, or on one that graded only part of what it mutated, publishing the
  score over those files to the run summary. Why it is selective, where the domain
  is read from, which mutants count, which tests the run loads and what the floor
  means: docs/gates/mutation-lane.md, which is the one place any of that is
  argued.

inputs:
  working-directory:
    description: Where the repository root is.
    default: .
  mutation-floor:
    description: >-
      The mutation score the changed domain files must hold, as a fraction
      between 0 and 1 — the way bunfig.toml writes coverageThreshold. Empty
      publishes the score and bounds nothing; every refusal this lane makes without
      one it still makes. A floor, not a target: docs/gates/mutation-lane.md.
    default: ""
  mutation-tests:
    description: >-
      The test files that grade the pure domain, as glob patterns relative to the
      working directory, one per line. The run hands exactly the files they name
      to bun test; a pattern that names nothing, reaches outside the working
      directory or names a file bunfig.toml ignores is refused. Empty lets the
      runner walk the project for every test file. docs/gates/mutation-lane.md.
    default: ""
  mutation-case-timeout:
    description: >-
      How long one test case may run before bun fails it, in milliseconds from 1
      to 540000, the lane's whole run. Stryker's deadline for a mutant is 1.5 ×
      what its tests took unmutated, plus this, so a timeout means a mutant that
      hangs rather than a busy runner; the lane's whole run ends at nine minutes
      whatever it is. Empty is 60000. docs/gates/mutation-lane.md.
    default: ""

runs:
  using: composite
  steps:
    # The two facts about the run are read from the `github` context here rather
    # than threaded through as inputs, for the reason repo-contract and db-gate
    # read them the same way: they are the event's own, identical for every
    # caller, and a caller that had to pass them could pass them wrong. The base
    # ref has to be in the checkout — fetch-depth: 0 — and this is refused
    # without it.
    - shell: bash
      env:
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_MUTATION_FLOOR: ${{ inputs['mutation-floor'] }}
        INPUT_MUTATION_TESTS: ${{ inputs['mutation-tests'] }}
        INPUT_MUTATION_CASE_TIMEOUT: ${{ inputs['mutation-case-timeout'] }}
        INPUT_BASE_REF: ${{ github.base_ref }}
        INPUT_BEFORE: ${{ github.event.before }}
      run: |
        set -euo pipefail
        INPUT_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bun --no-env-file "$GITHUB_ACTION_PATH/mutation-lane.main.ts"
