name: Queue audit
description: >-
  Reads the repo's labels and open issues, and reports the two ways a queue rots
  without anyone noticing: a vocabulary that has drifted, and a commitment whose
  trigger was never written down. Read-only. Needs GH_TOKEN and GH_REPO in the
  environment.

inputs:
  vocabulary:
    description: Every label the repo may carry, space-separated. Empty means the canon set.
    default: ""
  commitment-label:
    description: The label whose issues must state a Trigger in the body. Empty means the canon one.
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        INPUT_VOCABULARY: ${{ inputs.vocabulary }}
        INPUT_COMMITMENT_LABEL: ${{ inputs.commitment-label }}
      run: |
        set -euo pipefail
        bun "$GITHUB_ACTION_PATH/queue-audit.main.ts"
