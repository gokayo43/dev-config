name: Suppression hygiene
description: >-
  Two ways work hides in a tree rather than in the queue: a lint directive that
  suppresses a finding without saying why, and a checked-in list of things to do
  that nobody can label, assign or close.

inputs:
  working-directory:
    description: Where the repository root is.
    default: .
  fixtures:
    description: >-
      Paths whose directives are fixture text rather than suppressions,
      space-separated. Only a suite that tests this gate has any.
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_FIXTURES: ${{ inputs.fixtures }}
      run: |
        set -euo pipefail
        bun "$GITHUB_ACTION_PATH/suppression-hygiene.main.ts"
