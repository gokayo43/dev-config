name: Secret scan
description: >-
  Scans the checked-out repository's history with gitleaks. The caller's
  checkout has to set fetch-depth: 0 — a shallow clone hides a secret that was
  committed and later deleted on the same branch — and this fails if it did not.

inputs:
  working-directory:
    description: >-
      Which repository to scan. The default is the checkout; a caller that
      generates a tree of its own points this at that tree, since a secret a
      scaffolder writes is one no scan of the checkout will ever see.
    default: .

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        # renovate: datasource=github-release-attachments depName=gitleaks/gitleaks
        GITLEAKS_VERSION: v8.30.1
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: |
        set -euo pipefail
        # `gitleaks git` over a directory that is no repository, or one with no
        # commits yet, logs its complaint and exits 0 having scanned nothing —
        # so a secret sitting in the tree passes. Neither is caught by the
        # shallow test below either: a failed `git rev-parse` substitutes empty,
        # which is not "true", and the check walks straight past. So both are
        # asserted first, and loudly: a scan of nothing must never read as a
        # clean scan.
        if ! git rev-parse --git-dir > /dev/null 2>&1; then
          echo "::error::there is no git repository here — gitleaks reads history, and it would report a clean scan of nothing"
          exit 1
        fi
        if ! git rev-parse --verify HEAD > /dev/null 2>&1; then
          echo "::error::this repository has no commits — gitleaks reads history, and it would report a clean scan of nothing"
          exit 1
        fi
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::error::checkout with fetch-depth: 0 — gitleaks reads history, and a shallow clone has none"
          exit 1
        fi
        # shellcheck source=/dev/null
        . "$GITHUB_ACTION_PATH/../_lib/pinned-tool.sh"
        pinned_tool \
          "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" \
          "$GITLEAKS_SHA256" gitleaks
        "$RUNNER_TEMP/gitleaks" git . --redact --no-banner
