name: Compose lint
description: >-
  Holds a compose file to the deployment shape this box runs: loopback-bound
  ports, memory caps, healthchecks and the one-shot migrate service every app
  waits on. Each rule and what waives it: docs/gates/compose-lint.md.

inputs:
  working-directory:
    description: Where the repository root is.
    default: .
  file:
    description: The compose file to read, relative to the repository root.
    default: docker-compose.yml

runs:
  using: composite
  steps:
    - shell: bash
      env:
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_FILE: ${{ inputs.file }}
      run: |
        set -euo pipefail
        bun "$GITHUB_ACTION_PATH/compose-lint.main.ts"
