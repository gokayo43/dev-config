name: Database gate
description: >-
  Replays the migrations onto the empty Postgres the caller declared, twice, and
  boots the app against the result. Reads DATABASE_URL from the environment —
  the caller declares the service, so it owns the URL — and REDIS_URL when the
  app needs one.

inputs:
  working-directory:
    description: Where the project lives.
    default: .
  start-command:
    description: How to start the app. Runs as shell code.
    required: true
  health-url:
    description: The URL to poll until it answers 200.
    required: true
  timestamp-allowlist:
    description: >-
      table.column entries, space-separated, whose value really is a wall-clock
      reading rather than an instant.
    default: ""

runs:
  using: composite
  steps:
    # A migration that only applies to an already-migrated database — a DROP
    # CONSTRAINT for one a DROP TABLE ... CASCADE has already taken, say —
    # succeeds where it was written and aborts the first time the history runs
    # onto nothing. The second pass has to leave the schema identical: an exit
    # code alone would pass a runner that re-executed the DDL.
    - name: Migrate from empty, twice
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        : "${DATABASE_URL:?the calling job must set DATABASE_URL for the database it declared}"
        # pg_dump wraps its output in \restrict tokens that are random per
        # invocation, so two dumps of one schema never compare equal as-is.
        dump() { pg_dump --schema-only "$DATABASE_URL" | grep -vE '^\\(un)?restrict '; }
        bun run db:migrate
        dump > "$RUNNER_TEMP/schema-once.sql"
        bun run db:migrate
        dump > "$RUNNER_TEMP/schema-twice.sql"
        diff -u "$RUNNER_TEMP/schema-once.sql" "$RUNNER_TEMP/schema-twice.sql" \
          || { echo "::error::the second migrate changed the schema"; exit 1; }

    # The dump is already in hand, and it is the only place the real column type
    # is visible: an ORM's `timestamp` is a hint, the database is the fact.
    - name: Every instant carries its zone
      shell: bash
      env:
        INPUT_TIMESTAMP_ALLOWLIST: ${{ inputs.timestamp-allowlist }}
      run: |
        set -euo pipefail
        bun "$GITHUB_ACTION_PATH/timestamptz.ts" "$RUNNER_TEMP/schema-once.sql"

    # Migrations applying is half of it; the app running against the schema they
    # produced is the other half. Health answers 200 only once the process is up
    # and a query has round-tripped. SITE_URL and BETTER_AUTH_SECRET are the
    # house server env contract, dummied — a real secret in a workflow is a
    # leaked secret.
    - name: Boot against that database
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        START_COMMAND: ${{ inputs.start-command }}
        HEALTH_URL: ${{ inputs.health-url }}
        SITE_URL: http://localhost
        BETTER_AUTH_SECRET: ci-not-a-secret-ci-not-a-secret-ci
      run: |
        set -euo pipefail
        bash -c "$START_COMMAND" > "$RUNNER_TEMP/server.log" 2>&1 &
        # HEALTH_URL is expanded by the inner shell, from the environment.
        # shellcheck disable=SC2016
        timeout 60 bash -c 'until curl -sf "$HEALTH_URL"; do sleep 2; done' \
          || { cat "$RUNNER_TEMP/server.log"; exit 1; }
