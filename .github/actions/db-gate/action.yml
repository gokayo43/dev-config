name: Database gate
description: >-
  Replays the migrations onto the empty Postgres the caller declared, twice —
  and, where the caller asks for it, from the base ref's migrations as well,
  with the repo's own legacy rows written into that replay — boots the app
  against the result, probes it where the repo has one, holds its route table
  to the routes the base ref served, and throws generated junk at every route
  in it. Every step reads
  DATABASE_URL from the environment — the caller declares the service, so it
  owns the URL, and one value means no two steps can disagree about which
  database was migrated — plus REDIS_URL when the app needs one.

inputs:
  working-directory:
    description: Where the project lives.
    default: .
  upgrade-gate:
    description: >-
      Also prove that upgrading a database built from the base ref's migrations
      reaches the schema a fresh one gets. Needs the base ref in the checkout —
      fetch-depth: 0 — and a second database on the declared service.
    default: "false"
  semantic-fixtures:
    description: >-
      A directory of this repo's own holding the rows a deployed database
      already has, as base-compatible SQL, each with the assertion the current
      contract makes about them. Written into the base ref's replay and graded
      after this branch's migrations run over them, which is why it needs
      upgrade-gate as well.
    default: ""
  backfill-seed:
    description: >-
      How to put a database into the state this repo's backfill was written for.
      Runs as shell code, against a database of the check's own. Set it with
      backfill-command or not at all.
    default: ""
  backfill-command:
    description: >-
      The backfill, run twice against the state backfill-seed wrote, with the
      data compared either side of the second run. Runs as shell code. Set it
      with backfill-seed or not at all.
    default: ""
  start-command:
    description: How to start the app. Runs as shell code.
    required: true
  health-url:
    description: The URL to poll until it answers 200.
    required: true
  probe-command:
    description: >-
      A command of the repo's own, run against the booted app after it answers
      its health route. Runs as shell code, with the app's
      URL in HEALTH_URL. Its stdout is the verdict: every line it writes there
      is one problem, whatever it exits with, since the gate running it cannot
      know what it was asserting.
    default: ""
  probe-timeout:
    description: >-
      How many seconds probe-command gets before it is killed. Empty takes the
      bound probe.ts declares, which is where the number and the argument for it
      live — a bound is what stops a probe that has wedged from spending the
      job's whole budget and taking the later steps' evidence with it. Set it with
      probe-command or not at all.
    default: ""
  db-gate-evidence:
    description: >-
      The artifact name for everything this gate leaves behind — the route-log
      snapshot, the route table the committed snapshot
      must hold, the three data dumps the backfill check compares, every request
      the fuzzer refused an answer to, and the app's own output, whichever of
      them the run got as far as writing. A matrix that
      runs more than one leg MUST give each its own: an artifact name may be claimed once per run, the
      default below is a constant, and the second leg to upload fails on the
      duplicate. Empty takes that default, so a caller can pass this straight
      through without having to know how "unset" is spelled.
    default: ""
  route-allowlist:
    description: >-
      Routes the fuzzer sends no generated request to, as `METHOD /path --
      why` entries matching the app's own route table, one per line — a route
      that is destructive, credentialed or reaches off this box. The reason is
      part of the entry, the price a lint directive pays, and an entry naming a
      route the app does not serve is refused.
    default: ""
  route-retire:
    description: >-
      Routes this repo has deliberately stopped serving, as `METHOD /path --
      why` entries matching the base ref's routes.snapshot.json, one per line.
      Read only where the lifecycle field says live, since that is where the
      routes the base ref served are held at all. The reason is part of the
      entry, the price a lint directive pays.
    default: ""
  nightly:
    description: >-
      Give the steps that can search longer their long budget — the fuzzer's,
      today. The two numbers are the fuzz module's own, since a budget nobody
      can name from a workflow is one nobody can quietly turn down.
    default: "false"
  fuzz-seed:
    description: >-
      The seed the fuzzer generates from, so that a failing run can be sent
      again: paste the number its summary printed. Empty derives one from the
      run's id, which is what makes a re-run search somewhere new.
    default: ""
  timestamp-allowlist:
    description: >-
      Columns whose value really is a wall-clock reading rather than an instant,
      as `schema.table.column -- why` entries, one per line — an identifier may
      itself contain a space. The reason is part of the entry, the price a lint
      directive pays. An entry naming a column the schema does not have, or one
      that is no longer a wall-clock column, is refused rather than kept.
    default: ""

# One action rather than several, and not because everything here is about the
# database — "Replay the migrations", "Every instant carries its zone" and "A
# backfill that can be run twice" are, while "Boot against that database",
# "Read the route table", "Every route the base ref served" and "Generated
# requests at every route" are about the app the schema has to be able to run.
# The directory is named for what `database: postgres` buys.
#
# What holds them together is the migrated database itself: every step below is
# rooted in the replay, and the app steps are ordered among themselves — nothing
# can read a column type before the migrations ran, boot before there is a
# schema, or probe, read a route table or fuzz a route before the app answers.
# The two database steps beside the replay are free of each other and of the
# rest — reading a column type says nothing about rows, and the backfill check
# works in a database of its own — which makes this a partial order rather than
# a chain, and one composite's step list is the strongest form that ordering
# takes: split across actions it becomes prose in two descriptions and an order
# a caller can get wrong.
#
# "Publish what the gate read" is what settles it. The route-log snapshot comes
# from "Read the route table", the route table a repo has to commit from "Every
# route the base ref served", the three data dumps from the backfill check, the
# fuzzer's own report from the step after them, the app's own output from "Boot
# against that database", and db-gate-evidence above says why they leave as one
# artifact — so one job's evidence is one upload, and an upload belongs to
# whatever runs the whole job. Which is to say the boundary cannot be drawn
# between the database and the app either.
runs:
  using: composite
  steps:
    # Replays the history from empty twice, and — with upgrade-gate — from the
    # base ref's migrations as well, comparing every result with the same
    # normalised pg_dump. docs/gates/db-gate.md and docs/gates/upgrade-path.md
    # say what each replay proves.
    #
    # The two facts about the run are read from the `github` context here rather
    # than threaded through as inputs: they are the event's own, identical for
    # every caller, and a caller that had to pass them could pass them wrong.
    - name: Replay the migrations
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_UPGRADE_GATE: ${{ inputs.upgrade-gate }}
        INPUT_SEMANTIC_FIXTURES: ${{ inputs.semantic-fixtures }}
        INPUT_BASE_REF: ${{ github.base_ref }}
        INPUT_BEFORE: ${{ github.event.before }}
      run: |
        set -euo pipefail
        bun "$GITHUB_ACTION_PATH/replay.main.ts"

    # The database that has just been migrated is the authority on its own
    # column types — an ORM's `timestamp` is a hint — so it is asked directly.
    - name: Every instant carries its zone
      shell: bash
      env:
        INPUT_TIMESTAMP_ALLOWLIST: ${{ inputs.timestamp-allowlist }}
      run: |
        set -euo pipefail
        bun "$GITHUB_ACTION_PATH/timestamptz.main.ts"

    # A backfill is re-run whenever a deploy is retried or resumed, so running it
    # twice has to leave what one run left. In a database of the check's own,
    # built by the same migrations: the seed writes rows, and the boot step
    # below claims the app comes up against a database its migrations built.
    #
    # The condition is either input rather than both, so that a caller who set
    # one of them is told so — being quietly ignored is how a gate somebody
    # asked for turns out never to have run.
    - name: A backfill that can be run twice
      if: ${{ inputs.backfill-command != '' || inputs.backfill-seed != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_BACKFILL_SEED: ${{ inputs.backfill-seed }}
        INPUT_BACKFILL_COMMAND: ${{ inputs.backfill-command }}
        INPUT_SEEDED_DATA: ${{ runner.temp }}/backfill-seeded.rows
        INPUT_FIRST_DATA: ${{ runner.temp }}/backfill-first.rows
        INPUT_SECOND_DATA: ${{ runner.temp }}/backfill-second.rows
      run: |
        set -euo pipefail
        bun "$GITHUB_ACTION_PATH/backfill.main.ts"

    # Migrations applying is half of it; the app running against the schema they
    # produced is the other half. Health answers 200 only once the process is up
    # and a query has round-tripped. SITE_URL and BETTER_AUTH_SECRET are the
    # house server env contract, dummied — a real secret in a workflow is a
    # leaked secret.
    - name: Boot against that database
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        START_COMMAND: ${{ inputs.start-command }}
        HEALTH_URL: ${{ inputs.health-url }}
        SITE_URL: http://localhost
        BETTER_AUTH_SECRET: ci-not-a-secret-ci-not-a-secret-ci
        # The app serves an endpoint naming every route it has. Set only here:
        # it is an instrument for the gates over the route table, not a
        # surface, and no deployment sets it.
        ROUTE_LOG: "true"
      run: |
        set -euo pipefail
        bash -c "$START_COMMAND" > "$RUNNER_TEMP/server.log" 2>&1 &
        app=$!
        # Polled against the process as well as the URL: a start command that
        # dies on its first line otherwise looks exactly like a slow boot, and
        # the run spends its whole budget before saying so.
        deadline=$((SECONDS + 60))
        # --max-time bounds each attempt: a process that accepts the connection
        # and never answers is otherwise indistinguishable from a slow boot, and
        # curl would sit on it until the job timeout with nothing logged.
        until curl -sf --connect-timeout 2 --max-time 5 "$HEALTH_URL" > /dev/null; do
          if ! kill -0 "$app" 2> /dev/null; then
            echo "::error::the app exited before $HEALTH_URL answered"
            cat "$RUNNER_TEMP/server.log"
            exit 1
          fi
          if [ "$SECONDS" -ge "$deadline" ]; then
            echo "::error::$HEALTH_URL did not answer within 60s"
            cat "$RUNNER_TEMP/server.log"
            exit 1
          fi
          sleep 2
        done

    # After the boot, which is the only place it can ask what it asks. Health
    # answering 200 says the app starts against this schema, and says nothing
    # about whether an answer was correct: a migration that quietly
    # reinterprets a column passes it — so the repo gets one command here to
    # assert what only it knows.
    #
    # Its stdout is the protocol: the gate owns the running and the repo owns
    # the meaning.
    #
    # Either input selects it, so that a caller who set only the bound is told
    # so rather than ignored — the condition the backfill check is written with,
    # for the same reason.
    - name: The repo's own probe of the booted app
      if: ${{ inputs.probe-command != '' || inputs.probe-timeout != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_PROBE_COMMAND: ${{ inputs.probe-command }}
        INPUT_PROBE_TIMEOUT: ${{ inputs.probe-timeout }}
        INPUT_HEALTH_URL: ${{ inputs.health-url }}
      run: |
        set -euo pipefail
        bun "$GITHUB_ACTION_PATH/probe.main.ts"

    # One read of the app's route table, which both steps after it grade: the
    # compatibility floor and the fuzzer read this file rather than the app, so
    # the two cannot be handed different tables.
    - name: Read the route table
      shell: bash
      env:
        HEALTH_URL: ${{ inputs.health-url }}
      run: |
        set -euo pipefail
        # The one place the protocol's endpoint is written out rather than
        # imported: this is bash, and nothing here can read route-log.ts. Every
        # other copy — the gate's, and both apps' — comes from ENDPOINT there.
        route_log="$(echo "$HEALTH_URL" | sed -E 's#^(https?://[^/]+).*#\1#')/__route-log"
        # Bounded for the reason the health poll above is: an app that accepts
        # the connection and never answers is otherwise indistinguishable from
        # a slow read and costs the job's whole timeout to say so. Landed by
        # rename, because the shell opens the redirect before curl runs:
        # writing straight to the destination leaves an empty file behind when
        # the fetch fails, which the evidence artifact would carry as a
        # snapshot nobody took.
        snapshot="$RUNNER_TEMP/route-log.json"
        if ! curl -sSf --connect-timeout 5 --max-time 30 "$route_log" > "$snapshot.part"; then
          rm -f "$snapshot.part"
          echo "::error::$route_log did not answer — an app under the database job serves the route-log endpoint when ROUTE_LOG is set"
          exit 1
        fi
        mv "$snapshot.part" "$snapshot"

    # The floor over the route table, and the one gate here that outlives its
    # run: it asks whether the repo has stopped serving a route people already
    # call. It writes the content the repo's own routes.snapshot.json must hold
    # — which is why there is no regeneration script anywhere: the gate is the
    # generator.
    #
    # Here rather than beside the replay because a route table is the app's to
    # declare and only a booted app has declared one.
    - name: Every route the base ref served
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_ROUTE_LOG: ${{ runner.temp }}/route-log.json
        INPUT_ROUTE_RETIRE: ${{ inputs.route-retire }}
        INPUT_SNAPSHOT_EVIDENCE: ${{ runner.temp }}/routes.snapshot.json
        # The event's own two facts, read from the `github` context here rather
        # than threaded through as inputs, exactly as the replay reads them: they
        # are identical for every caller, and a caller that had to pass them
        # could pass them wrong.
        INPUT_BASE_REF: ${{ github.base_ref }}
        INPUT_BEFORE: ${{ github.event.before }}
      run: |
        set -euo pipefail
        bun "$GITHUB_ACTION_PATH/route-compat.main.ts"

    # The second question asked of the route table, and the only one about
    # answers. It grades route-allowlist itself, which is the hatch over the
    # routes it sends nothing to.
    - name: Generated requests at every route
      shell: bash
      env:
        INPUT_HEALTH_URL: ${{ inputs.health-url }}
        INPUT_ROUTE_LOG: ${{ runner.temp }}/route-log.json
        INPUT_ROUTE_ALLOWLIST: ${{ inputs.route-allowlist }}
        INPUT_FUZZ_SEED: ${{ inputs.fuzz-seed }}
        INPUT_NIGHTLY: ${{ inputs.nightly }}
        INPUT_REPORT_FILE: ${{ runner.temp }}/fuzz.json
      run: |
        set -euo pipefail
        # The run summary is named here rather than in `env:` above: it is a
        # path the runner exports into the step's environment, and no
        # expression context carries it.
        INPUT_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bun "$GITHUB_ACTION_PATH/fuzz.main.ts"

    # Everything the steps above wrote into the runner's workspace, which the
    # next run's checkout cleans away. A step that failed is exactly when its
    # partial evidence is worth having — the route table behind a floor's
    # verdict, the fuzzer's report, the output of an app that never answered —
    # and a cancelled run has nothing to say. Reproducing any of
    # them by re-running with more printing is the shape of debugging every
    # diagnostic here exists to avoid, so the files leave the run whatever
    # happened to it.
    - name: Publish what the gate read
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        # The one place this name is defaulted, so a caller passing an empty
        # string through is the same as a caller not asking for one. One
        # artifact rather than one per file, for the reason the input above
        # gives: a matrix leg that gave this input its own name would still
        # collide on any second name written out here.
        name: ${{ inputs['db-gate-evidence'] || 'db-gate-evidence' }}
        # server.log is copied while the app still holds it open, which is not a
        # race to fix: the fuzzer needs the process alive, so there is no moment
        # where the file is finished and the run is not. Read its tail as
        # possibly torn, and anything the app buffered and had not flushed as
        # simply absent. The boot step's own annotation, not this file, is what
        # says an app failed to start.
        path: |
          ${{ runner.temp }}/backfill-seeded.rows
          ${{ runner.temp }}/backfill-first.rows
          ${{ runner.temp }}/backfill-second.rows
          ${{ runner.temp }}/route-log.json
          ${{ runner.temp }}/routes.snapshot.json
          ${{ runner.temp }}/fuzz.json
          ${{ runner.temp }}/server.log
        # Each of these is written by a step that may not have been reached.
        if-no-files-found: ignore
