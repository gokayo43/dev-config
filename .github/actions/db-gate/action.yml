name: Database gate
description: >-
  Replays the migrations onto the empty Postgres the caller declared, twice,
  boots the app against the result, and optionally ramps it. Every step reads
  DATABASE_URL from the environment — the caller declares the service, so it
  owns the URL, and one value means no two steps can disagree about which
  database was migrated — plus REDIS_URL when the app needs one.

inputs:
  working-directory:
    description: Where the project lives.
    default: .
  start-command:
    description: How to start the app. Runs as shell code.
    required: true
  health-url:
    description: The URL to poll until it answers 200.
    required: true
  capacity:
    description: Run a k6 ramp against the booted app and publish what it measured.
    default: "false"
  capacity-script:
    description: A k6 script of the repo's own. Empty runs the ramp shipped with this action.
    default: ""
  capacity-path:
    description: A hot path to ramp alongside the health route, e.g. /api/things.
    default: ""
  capacity-report:
    description: >-
      The artifact name for the k6 summary. A matrix that ramps more than one
      leg gives each its own, since an artifact name may only be claimed once.
    default: capacity-report
  timestamp-allowlist:
    description: >-
      schema.table.column entries whose value really is a wall-clock reading
      rather than an instant, comma- or newline-separated — an identifier may
      itself contain a space.
    default: ""

runs:
  using: composite
  steps:
    # A migration that only applies to an already-migrated database — a DROP
    # CONSTRAINT for one a DROP TABLE ... CASCADE has already taken, say —
    # succeeds where it was written and aborts the first time the history runs
    # onto nothing. The second pass has to leave the schema identical: an exit
    # code alone would pass a runner that re-executed the DDL.
    - name: Migrate from empty, twice
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        : "${DATABASE_URL:?the calling job must set DATABASE_URL for the database it declared}"
        # pg_dump wraps its output in \restrict tokens that are random per
        # invocation, so two dumps of one schema never compare equal as-is.
        dump() { pg_dump --schema-only "$DATABASE_URL" | grep -vE '^\\(un)?restrict '; }
        bun run db:migrate
        dump > "$RUNNER_TEMP/schema-once.sql"
        bun run db:migrate
        dump > "$RUNNER_TEMP/schema-twice.sql"
        diff -u "$RUNNER_TEMP/schema-once.sql" "$RUNNER_TEMP/schema-twice.sql" \
          || { echo "::error::the second migrate changed the schema"; exit 1; }

    # The database that has just been migrated is the authority on its own
    # column types — an ORM's `timestamp` is a hint — so it is asked directly.
    - name: Every instant carries its zone
      shell: bash
      env:
        INPUT_TIMESTAMP_ALLOWLIST: ${{ inputs.timestamp-allowlist }}
      run: |
        set -euo pipefail
        bun "$GITHUB_ACTION_PATH/timestamptz.main.ts"

    # Migrations applying is half of it; the app running against the schema they
    # produced is the other half. Health answers 200 only once the process is up
    # and a query has round-tripped. SITE_URL and BETTER_AUTH_SECRET are the
    # house server env contract, dummied — a real secret in a workflow is a
    # leaked secret.
    - name: Boot against that database
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        START_COMMAND: ${{ inputs.start-command }}
        HEALTH_URL: ${{ inputs.health-url }}
        SITE_URL: http://localhost
        BETTER_AUTH_SECRET: ci-not-a-secret-ci-not-a-secret-ci
      run: |
        set -euo pipefail
        bash -c "$START_COMMAND" > "$RUNNER_TEMP/server.log" 2>&1 &
        app=$!
        # Polled against the process as well as the URL: a start command that
        # dies on its first line otherwise looks exactly like a slow boot, and
        # the run spends its whole budget before saying so.
        deadline=$((SECONDS + 60))
        until curl -sf "$HEALTH_URL" > /dev/null; do
          if ! kill -0 "$app" 2> /dev/null; then
            echo "::error::the app exited before $HEALTH_URL answered"
            cat "$RUNNER_TEMP/server.log"
            exit 1
          fi
          if [ "$SECONDS" -ge "$deadline" ]; then
            echo "::error::$HEALTH_URL did not answer within 60s"
            cat "$RUNNER_TEMP/server.log"
            exit 1
          fi
          sleep 2
        done

    # A number, not a threshold. See docs/gates/capacity.md: on a shared runner
    # a latency bound measures the runner, and a gate that fails on that is one
    # people turn off. The step fails only when no measurement was produced.
    - name: Capacity ramp
      if: ${{ inputs.capacity == 'true' }}
      shell: bash
      env:
        # renovate: datasource=github-release-attachments depName=grafana/k6
        K6_VERSION: v2.1.0
        K6_SHA256: 295d961ebfca306f295f1133068dcd403a8171c87f387928f5f30b0fbcff858a
        HEALTH_URL: ${{ inputs.health-url }}
        CAPACITY_PATH: ${{ inputs.capacity-path }}
        CAPACITY_SCRIPT: ${{ inputs.capacity-script }}
      run: |
        set -euo pipefail
        # shellcheck source=/dev/null
        . "$GITHUB_ACTION_PATH/../_lib/pinned-tool.sh"
        pinned_tool \
          "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" \
          "$K6_SHA256" "k6-${K6_VERSION}-linux-amd64/k6"
        script="${CAPACITY_SCRIPT:-$GITHUB_ACTION_PATH/capacity.js}"
        "$RUNNER_TEMP/k6" run --quiet \
          --summary-trend-stats='avg,min,med,p(95),p(99),max' \
          --summary-export "$RUNNER_TEMP/capacity.json" "$script"
        INPUT_SUMMARY_FILE="$RUNNER_TEMP/capacity.json" INPUT_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" \
          bun "$GITHUB_ACTION_PATH/capacity.main.ts"

    # always(): a ramp that failed on the way to a number is exactly when the
    # partial summary is worth having.
    - name: Publish the capacity report
      if: ${{ always() && inputs.capacity == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.capacity-report }}
        path: ${{ runner.temp }}/capacity.json
        if-no-files-found: ignore
