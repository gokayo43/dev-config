name: Database gate
description: >-
  Replays the migrations onto the empty Postgres the caller declared, twice —
  and, where the caller asks for it, from the base ref's migrations as well —
  boots the app against the result, and ramps it. Every step reads
  DATABASE_URL from the environment — the caller declares the service, so it
  owns the URL, and one value means no two steps can disagree about which
  database was migrated — plus REDIS_URL when the app needs one.

inputs:
  working-directory:
    description: Where the project lives.
    default: .
  upgrade-gate:
    description: >-
      Also prove that upgrading a database built from the base ref's migrations
      reaches the schema a fresh one gets. Needs the base ref in the checkout —
      fetch-depth: 0 — and a second database on the declared service.
    default: "false"
  backfill-seed:
    description: >-
      How to put a database into the state this repo's backfill was written for.
      Runs as shell code, against a database of the check's own. Set it with
      backfill-command or not at all.
    default: ""
  backfill-command:
    description: >-
      The backfill, run twice against the state backfill-seed wrote, with the
      data compared either side of the second run. Runs as shell code. Set it
      with backfill-seed or not at all.
    default: ""
  start-command:
    description: How to start the app. Runs as shell code.
    required: true
  health-url:
    description: The URL to poll until it answers 200.
    required: true
  capacity-script:
    description: A k6 script of the repo's own. Empty runs the ramp shipped with this action.
    default: ""
  capacity-path:
    description: >-
      Paths to ramp alongside the health route, e.g. /api/things — one per
      line, since an app serves more than one route and the floor below asks
      for all of them.
    default: ""
  db-gate-evidence:
    description: >-
      The artifact name for everything this gate leaves behind — the k6
      summary, both route-log snapshots, the three data dumps the backfill
      check compares and the app's own output, whichever of them the run got as
      far as writing. A matrix that runs more than one leg
      MUST give each its own: an artifact name may be claimed once per run, the
      default below is a constant, and the second leg to upload fails on the
      duplicate. Empty takes that default, so a caller can pass this straight
      through without having to know how "unset" is spelled.
    default: ""
  route-allowlist:
    description: >-
      Routes the ramp is not expected to reach, as `METHOD /path -- why`
      entries matching the app's own route table, one per line. The reason is
      part of the entry, the price a lint directive pays.
    default: ""
  timestamp-allowlist:
    description: >-
      Columns whose value really is a wall-clock reading rather than an instant,
      as `schema.table.column -- why` entries, one per line — an identifier may
      itself contain a space. The reason is part of the entry, the price a lint
      directive pays. An entry naming a column the schema does not have, or one
      that is no longer a wall-clock column, is refused rather than kept.
    default: ""

# One action rather than several, and not because everything here is about the
# database — "Replay the migrations", "Every instant carries its zone" and "A
# backfill that can be run twice" are, while "Boot against that database",
# "Capacity ramp" and "Every route the ramp reaches" are about the app the
# schema has to be able to run. The directory is named for what
# `database: true` buys.
#
# What holds them together is the migrated database itself: every step below is
# rooted in the replay, and the app steps are ordered among themselves — nothing
# can read a column type before the migrations ran, boot before there is a
# schema, ramp before the app answers, or count routes before the ramp. The two
# database steps beside the replay are free of each other and of the rest —
# reading a column type says nothing about rows, and the backfill check works in
# a database of its own — which makes this a partial order rather than a chain,
# and one composite's step list is the strongest form that ordering takes: split
# across actions it becomes prose in two descriptions and an order a caller can
# get wrong.
#
# "Publish what the ramp measured and what it read" is what settles it. The k6
# summary and both route-log snapshots come from "Capacity ramp", the three data
# dumps from the backfill check, the app's own output from "Boot against that
# database", and db-gate-evidence above says why they leave as one artifact — so
# one job's evidence is one upload, and an upload belongs to whatever runs the
# whole job. Which is to say the boundary cannot be drawn between the database
# and the app either.
runs:
  using: composite
  steps:
    # Replays the history from empty twice, and — with upgrade-gate — from the
    # base ref's migrations as well, comparing every result with the same
    # normalised pg_dump. docs/gates/db-gate.md and docs/gates/upgrade-path.md
    # say what each replay proves.
    #
    # The two facts about the run are read from the `github` context here rather
    # than threaded through as inputs: they are the event's own, identical for
    # every caller, and a caller that had to pass them could pass them wrong.
    - name: Replay the migrations
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_UPGRADE_GATE: ${{ inputs.upgrade-gate }}
        INPUT_BASE_REF: ${{ github.base_ref }}
        INPUT_BEFORE: ${{ github.event.before }}
      run: |
        set -euo pipefail
        bun "$GITHUB_ACTION_PATH/replay.main.ts"

    # The database that has just been migrated is the authority on its own
    # column types — an ORM's `timestamp` is a hint — so it is asked directly.
    - name: Every instant carries its zone
      shell: bash
      env:
        INPUT_TIMESTAMP_ALLOWLIST: ${{ inputs.timestamp-allowlist }}
      run: |
        set -euo pipefail
        bun "$GITHUB_ACTION_PATH/timestamptz.main.ts"

    # A backfill is re-run whenever a deploy is retried or resumed, so running it
    # twice has to leave what one run left. In a database of the check's own,
    # built by the same migrations: the seed writes rows, and the boot step
    # below claims the app comes up against a database its migrations built.
    #
    # The condition is either input rather than both, so that a caller who set
    # one of them is told so — being quietly ignored is how a gate somebody
    # asked for turns out never to have run.
    - name: A backfill that can be run twice
      if: ${{ inputs.backfill-command != '' || inputs.backfill-seed != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_BACKFILL_SEED: ${{ inputs.backfill-seed }}
        INPUT_BACKFILL_COMMAND: ${{ inputs.backfill-command }}
        INPUT_SEEDED_DATA: ${{ runner.temp }}/backfill-seeded.sql
        INPUT_FIRST_DATA: ${{ runner.temp }}/backfill-first.sql
        INPUT_SECOND_DATA: ${{ runner.temp }}/backfill-second.sql
      run: |
        set -euo pipefail
        bun "$GITHUB_ACTION_PATH/backfill.main.ts"

    # Migrations applying is half of it; the app running against the schema they
    # produced is the other half. Health answers 200 only once the process is up
    # and a query has round-tripped. SITE_URL and BETTER_AUTH_SECRET are the
    # house server env contract, dummied — a real secret in a workflow is a
    # leaked secret.
    - name: Boot against that database
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        START_COMMAND: ${{ inputs.start-command }}
        HEALTH_URL: ${{ inputs.health-url }}
        SITE_URL: http://localhost
        BETTER_AUTH_SECRET: ci-not-a-secret-ci-not-a-secret-ci
        # The app serves a counter endpoint naming every route it has and how
        # many requests each has taken. Set only here: it is an instrument for
        # the coverage floor, not a surface, and no deployment sets it.
        ROUTE_LOG: "true"
      run: |
        set -euo pipefail
        bash -c "$START_COMMAND" > "$RUNNER_TEMP/server.log" 2>&1 &
        app=$!
        # Polled against the process as well as the URL: a start command that
        # dies on its first line otherwise looks exactly like a slow boot, and
        # the run spends its whole budget before saying so.
        deadline=$((SECONDS + 60))
        # --max-time bounds each attempt: a process that accepts the connection
        # and never answers is otherwise indistinguishable from a slow boot, and
        # curl would sit on it until the job timeout with nothing logged.
        until curl -sf --connect-timeout 2 --max-time 5 "$HEALTH_URL" > /dev/null; do
          if ! kill -0 "$app" 2> /dev/null; then
            echo "::error::the app exited before $HEALTH_URL answered"
            cat "$RUNNER_TEMP/server.log"
            exit 1
          fi
          if [ "$SECONDS" -ge "$deadline" ]; then
            echo "::error::$HEALTH_URL did not answer within 60s"
            cat "$RUNNER_TEMP/server.log"
            exit 1
          fi
          sleep 2
        done

    # A number, not a latency threshold. See docs/gates/capacity.md: on a shared
    # runner a latency bound measures the runner, and a gate that fails on that
    # is one people turn off. The step fails when k6 died or breached the one
    # bound that is not the runner's — its failure rate — and when it produced
    # no measurement to record.
    - name: Capacity ramp
      shell: bash
      env:
        HEALTH_URL: ${{ inputs.health-url }}
        CAPACITY_PATH: ${{ inputs.capacity-path }}
        CAPACITY_SCRIPT: ${{ inputs.capacity-script }}
      run: |
        set -euo pipefail
        # shellcheck source=/dev/null
        . "$GITHUB_ACTION_PATH/../_lib/k6.sh"
        script="${CAPACITY_SCRIPT:-$GITHUB_ACTION_PATH/capacity.js}"
        # The route floor is the difference between these two reads of the app's
        # counters, so the health poll that got the app this far sits inside the
        # first and cannot be mistaken for a route the ramp exercised.
        #
        # The one place the protocol's endpoint is written out rather than
        # imported: this is bash, and nothing here can read route-log.ts. Every
        # other copy — the gate's, and both apps' — comes from ENDPOINT there.
        route_log="$(echo "$HEALTH_URL" | sed -E 's#^(https?://[^/]+).*#\1#')/__route-log"
        # Bounded for the reason the health poll above is: an app wedged under
        # the ramp accepts the connection and never answers, which is otherwise
        # indistinguishable from a slow read and costs the job's whole timeout
        # to say so. The ceiling is generous — this is a small JSON body from a
        # local process — so only a hang can reach it.
        # Landed by rename, because the shell opens the redirect before curl
        # runs: writing straight to the destination leaves an empty file behind
        # when the fetch fails. The step stops either way, so no gate reads it —
        # but the evidence artifact would carry 0 bytes that look like a
        # snapshot somebody took. Either the destination is absent or it is a
        # whole answer.
        #
        # The rename's own status is the function's: a fetch that worked and a
        # file that could not be moved onto its name is not a snapshot taken,
        # and mv has already said why on stderr.
        snapshot() {
          if ! curl -sSf --connect-timeout 5 --max-time 30 "$route_log" > "$1.part"; then
            rm -f "$1.part"
            echo "::error::$route_log did not answer — an app under the capacity ramp serves the route-log endpoint when ROUTE_LOG is set"
            return 1
          fi
          mv "$1.part" "$1"
        }
        snapshot "$RUNNER_TEMP/route-log-before.json"
        "$K6" run --quiet \
          --summary-trend-stats='avg,min,med,p(95),p(99),max' \
          --summary-export "$RUNNER_TEMP/capacity.json" "$script"
        # An app that died under the ramp fails the snapshot below AND breaches
        # the failure bound, and the bound is the diagnostic that says what
        # happened — so the snapshot's failure is held until the measurement has
        # been read and published, and the step then fails carrying both.
        status=0
        snapshot "$RUNNER_TEMP/route-log-after.json" || status=1
        # Always a runner here: this action only ever runs inside a workflow. A
        # ramp against the deployed shape is a different caller of the same
        # reader, and the caption it publishes says which of the two happened.
        INPUT_SUMMARY_FILE="$RUNNER_TEMP/capacity.json" INPUT_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" \
          INPUT_RAN_ON=ci-runner bun "$GITHUB_ACTION_PATH/capacity.main.ts" || status=1
        exit "$status"

    # The floor, not a realism claim: a route no request reached has never been
    # under load at all, which is the same thing the coverage threshold catches
    # about a module no test imports.
    - name: Every route the ramp reaches
      shell: bash
      env:
        INPUT_ROUTE_LOG_BEFORE: ${{ runner.temp }}/route-log-before.json
        INPUT_ROUTE_LOG_AFTER: ${{ runner.temp }}/route-log-after.json
        INPUT_ROUTE_ALLOWLIST: ${{ inputs.route-allowlist }}
      run: |
        set -euo pipefail
        bun "$GITHUB_ACTION_PATH/route-coverage.main.ts"

    # Everything the steps above wrote into the runner, which is deleted with
    # the runner. A step that failed on the way to a number is exactly when its
    # partial evidence is worth having — the summary of a ramp that died, the
    # two snapshots behind a floor's verdict, the output of an app that never
    # answered — and a cancelled run has nothing to say. Reproducing any of
    # them by re-running with more printing is the shape of debugging every
    # diagnostic here exists to avoid, so the files leave the run whatever
    # happened to it.
    - name: Publish what the ramp measured and what it read
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        # The one place this name is defaulted, so a caller passing an empty
        # string through is the same as a caller not asking for one. One
        # artifact rather than one per file, for the reason the input above
        # gives: a matrix leg that gave this input its own name would still
        # collide on any second name written out here.
        name: ${{ inputs['db-gate-evidence'] || 'db-gate-evidence' }}
        # server.log is copied while the app still holds it open, which is not a
        # race to fix: the ramp needs the process alive, so there is no moment
        # where the file is finished and the run is not. Read its tail as
        # possibly torn, and anything the app buffered and had not flushed as
        # simply absent. The boot step's own annotation, not this file, is what
        # says an app failed to start.
        path: |
          ${{ runner.temp }}/backfill-seeded.sql
          ${{ runner.temp }}/backfill-first.sql
          ${{ runner.temp }}/backfill-second.sql
          ${{ runner.temp }}/capacity.json
          ${{ runner.temp }}/route-log-before.json
          ${{ runner.temp }}/route-log-after.json
          ${{ runner.temp }}/server.log
        # Each of these is written by a step that may not have been reached.
        if-no-files-found: ignore
