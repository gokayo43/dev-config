name: Shell scripts
description: >-
  Runs shellcheck over every shell script the repository tracks, with the binary
  pinned by version and archive checksum. Which files, which shellcheck, what
  the escape hatch is and what it cannot see: docs/gates/shell-scripts.md.

inputs:
  working-directory:
    description: Where the repository root is.
    default: .

runs:
  using: composite
  steps:
    - shell: bash
      env:
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        # shellcheck source=/dev/null
        . "$GITHUB_ACTION_PATH/../_lib/shellcheck.sh"
        INPUT_SHELLCHECK="$SHELLCHECK" bun "$GITHUB_ACTION_PATH/shell-scripts.main.ts"
