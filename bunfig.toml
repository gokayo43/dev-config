[install]
# Supply-chain protection: refuse any version published in the last 7 days, so a
# compromised release that is detected and yanked within hours never reaches the
# lockfile. Paired with saveExact for exact, auditable pins.
#
# To bypass for one package (e.g. an urgent CVE patch):
#   minimumReleaseAgeExcludes = ["pkg-name"]
minimumReleaseAge = 604800 # 7 days, in seconds
saveExact = true

[test]
# A floor, not a target: it catches "shipped without tests", it is not something
# to chase. Bun exits non-zero on a breach WITHOUT printing why — a `bun test`
# that reports every test passing and still fails is this — and it applies the
# threshold to EVERY FILE, not to the total, so the floor sits below the
# least-covered file rather than below the summary line.
#
# Declared here, applied by the `--coverage` CI passes and by nothing local:
# docs/gates/test-suite.md.
coverageThreshold = { lines = 0.75, functions = 0.75 }
coverageSkipTestFiles = true
# Two things here execute only inside a spawned process, so the runner
# instruments them and then watches them run nowhere: the file reads as
# unreached and drags itself under the per-file floor.
#
# `anti-slop/**` — the plugin's rules run inside a spawned oxlint.
# `tests/anti-slop*.test.ts` is what actually grades them, by linting fixture
# trees with the shipped binary.
#
# `tests/house-limiter.ts` — the limiter every conformance fixture is built
# from, imported here only for its flaw names and run only by the `bun test`
# that `tests/limiter-conformance.test.ts` spawns. What grades it is that same
# suite: the house build has to pass the conformance suite and every flaw has to
# fail the case paired with it.
coveragePathIgnorePatterns = ["anti-slop/**", "tests/house-limiter.ts"]
