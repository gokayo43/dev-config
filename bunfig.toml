[install]
# Supply-chain protection: refuse any npm version published in the last 3 days,
# so a compromised release that is detected and yanked within hours never
# reaches the lockfile. Paired with `exact` for exact, auditable pins — the
# cooldown buys nothing over a spec that floats past it on the next install.
#
# `exact`, and not `saveExact`: bun reads the first and ignores the second
# (probed, 1.3.11 and 1.4.0 — `bun add` under `saveExact = true` writes a caret
# range, exactly as declaring neither does).
#
# The window reads npm publish times and never holds a git dependency (probed,
# bun 1.4.0: a commit hours old installs under a ten-year window), which is how
# every package this organisation publishes is installed. None of ours needs
# excluding.
#
# To bypass for one package (e.g. an urgent CVE patch), name it exactly. Bun
# ignores a scope pattern such as "@types/*", and an exclusion does not reach
# the package's own dependencies (both probed, bun 1.4.0):
#   minimumReleaseAgeExcludes = ["pkg-name"]
minimumReleaseAge = 259200 # 3 days, in seconds
exact = true

[test]
# What a run inherits from whoever started it, which under a git hook includes
# the repository that hook is acting on: tests/git-free-environment.ts.
preload = ["./tests/git-free-environment.ts"]
# A floor, not a target: it catches "shipped without tests", it is not something
# to chase. Bun exits non-zero on a breach WITHOUT printing why — a `bun test`
# that reports every test passing and still fails is this — and it applies the
# threshold to EVERY FILE, not to the total, so the floor sits below the
# least-covered file rather than below the summary line.
#
# Declared here, applied by the `--coverage` CI passes and by nothing local:
# docs/gates/test-suite.md.
coverageThreshold = { lines = 0.75, functions = 0.75 }
coverageSkipTestFiles = true
# Six files and the request-timing fixture apps here are graded by a suite that
# spawns a process rather than by the runner watching them execute, so the
# coverage they report is not the coverage they have. Each names the suite that
# carries its duty instead. The scratch trees last are no code of this repo.
#
# `anti-slop/**` — the plugin's rules run inside a spawned oxlint.
# `tests/anti-slop*.test.ts` is what actually grades them, by linting fixture
# trees with the shipped binary.
#
# `tests/house-limiter.ts` — the limiter every conformance fixture is built
# from, imported here only for its flaw names and run only by the `bun test`
# that `tests/limiter-conformance.test.ts` spawns. What grades it is that same
# suite: the house build has to pass the conformance suite and every flaw has to
# fail the case paired with it.
#
# `dev-server.ts` — a bin, and only the bin: what it is about is a detached
# child, a claimed port, a lock and a signal reaching a process group, none of
# which survive being called in-process, so the suite spawns the real binary and
# the runner watches this file run nowhere. `tests/dev-server.test.ts` carries
# its duty, naming the wrong implementation each case kills.
#
# `property.ts` — what it does is hand fast-check a bigger number, and the only
# thing that says whether that worked is how many times a predicate ran in a
# process the run's environment was set for. `tests/property.test.ts` spawns a
# `bun test` per case and reads that number back. It is here rather than left to
# the floor because it would otherwise be *nearly* covered by accident:
# `tests/fuzz.test.ts` calls `check` for its own properties, which walks the
# happy path and nothing else, and a floor met that way is a floor measuring
# somebody else's suite.
#
# `capacity-ramp.ts` — the capacity ramp's bin, which is argv, signals, stdout
# and an exit status around `capacity-ramp-ladder.ts`. What it is about is a
# status, a signal stopping a run and files a run did or did not leave, which
# only a spawned process has, so `tests/capacity-ramp.test.ts` runs the bin and
# reads them back.
#
# `request-timing-report.ts` — the request-timing reader's bin, which is stdin,
# stdout and an exit status around `request-timing-summary.ts`. The status is
# its contract, and only a spawned process has one, so
# `tests/request-timing-summary.test.ts` runs the bin and reads it back.
#
# `tests/request-timing-*-app/**` — the request-timing fixture apps, a Next.js
# app and a TanStack Start one, which run in the server a suite starts: `next
# start` in a process of its own, and the Start app as the Vite build in
# `node_modules/.cache`, so neither app's own source is the code that runs. The
# runner sees one only where a suite imports it: a constant module such as the
# Start app's `src/lanes.ts`, at whatever loading it executes, and every Next.js
# route module, which the conformance kit's route-tree check loads to read the
# mark a connector left on each handler. What grades the apps is the suites
# that serve them, `tests/request-timing-next.test.ts`,
# `tests/request-timing-trpc.test.ts` and
# `tests/request-timing-tanstack-start.test.ts`.
#
# `**/gate-fixtures-*/**` — the scratch trees `tests/tree.ts` writes under the
# temp directory, whose route files the route-tree check's own cases load for
# the same reason. They are what a case reads, not code of this repo.
#
# `dev-server-derive.ts` is deliberately NOT here: everything that can be
# answered without a machine was split into it for exactly that reason, and it is
# graded by the floor like anything else.
coveragePathIgnorePatterns = [
  "anti-slop/**",
  "tests/house-limiter.ts",
  "dev-server.ts",
  "property.ts",
  "capacity-ramp.ts",
  "request-timing-report.ts",
  "tests/request-timing-*-app/**",
  "**/gate-fixtures-*/**",
]
